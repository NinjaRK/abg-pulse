name: Safeguard release real-data preflight

on:
  workflow_dispatch:
  push:
    branches: ['fix/t51-claim-support-20260918']
    paths: ['.github/workflows/verify-safeguard-preflight.yml']

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve exact source and rollback source
        run: |
          mkdir -p /tmp/safeguard-preflight/prior
          git rev-parse HEAD > /tmp/safeguard-preflight/SOURCE_COMMIT.txt
          git rev-parse HEAD^{tree} > /tmp/safeguard-preflight/TREE.txt
          git archive --format=tar.gz -o /tmp/safeguard-preflight/candidate-source.tar.gz HEAD
          git archive --format=tar.gz -o /tmp/safeguard-preflight/prior/production-source.tar.gz 17d669f3e66806922e51b05d29f13f9c35fe95cd
          git show 17d669f3e66806922e51b05d29f13f9c35fe95cd:api/claims.js > /tmp/safeguard-preflight/prior/claims-reader.mjs
      - name: Verify the full candidate
        run: |
          npm test > /tmp/safeguard-preflight/tests.log 2>&1
          npm run check > /tmp/safeguard-preflight/syntax.log 2>&1
      - name: Preserve old public data and separate runtime observations
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const base = 'https://abg-pulse-intelligence-v4.vercel.app';
          const raw = 'https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data';
          const report = { observedAt: new Date().toISOString(), writesPerformed: false, deploymentPerformed: false, endpoints: [] };
          const targets = [
            ['snapshot', raw + '/live-snapshot.json', true],
            ['graph', raw + '/data/claim-evidence.json', true],
            ['manifest', raw + '/data/claim-evidence.manifest.json', true],
            ['health', base + '/api/health', false],
            ['scan', base + '/api/scan', false],
            ['claims', base + '/api/claims?summaryOnly=true', false],
            ['persistence', base + '/api/persistence-health', false]
          ];
          for (const [name, address, archive] of targets) {
            const record = { name, observedAt: new Date().toISOString() };
            try {
              const url = new URL(address); url.searchParams.set('preflight', `${process.env.GITHUB_RUN_ID}-${Date.now()}`);
              const response = await fetch(url, { method: 'GET', redirect: 'error', cache: 'no-store', headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(20000) });
              const text = await response.text();
              record.httpStatus = response.status; record.bytes = Buffer.byteLength(text);
              record.sha256 = createHash('sha256').update(text).digest('hex');
              const data = JSON.parse(text);
              record.error = data.error || null; record.generatedAt = data.generatedAt || null;
              record.commit = data.deployment?.commitSha || data.source?.commitSha || null;
              record.databaseConfigured = data.configured?.database ?? null;
              record.operational = data.operational ?? null;
              if (archive && response.ok) writeFileSync(`/tmp/safeguard-preflight/prior/${name}.json`, text);
            } catch (error) { record.requestError = String(error.message); }
            report.endpoints.push(record);
          }
          writeFileSync('/tmp/safeguard-preflight/observations.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Collect genuinely fresh source data without publishing
        env:
          SNAPSHOT_SPAN_DAYS: '30'
          SNAPSHOT_MIN_SUCCESS_RATIO: '0.30'
        run: node scripts/refresh-live-snapshot.mjs /tmp/safeguard-preflight/candidate-snapshot.json > /tmp/safeguard-preflight/collection.log 2>&1
      - name: Build the compatible claims graph from that exact input
        env:
          CLAIM_EVIDENCE_INPUT_FILE: /tmp/safeguard-preflight/candidate-snapshot.json
          CLAIM_EVIDENCE_INPUT_STALE_MINUTES: '180'
          UNSUPPORTED_MATERIALITY_FLOOR: '65'
          CLAIM_EVIDENCE_OUTPUT: /tmp/safeguard-preflight/candidate-claims.json
          CLAIM_EVIDENCE_MANIFEST_OUTPUT: /tmp/safeguard-preflight/candidate-manifest.json
        run: node scripts/build-claim-evidence-snapshot.mjs > /tmp/safeguard-preflight/graph-build.log 2>&1
      - name: Verify new-reader and old-reader compatibility without release writes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { validateClaimEvidenceGraph } from './api/claims.js';
          import { filterLiveSnapshot } from './lib/live-snapshot.mjs';
          import { snapshotIdentity, graphIdentity, sha256 } from './lib/data-integrity.mjs';
          import { validateClaimEvidenceGraph as legacyValidate } from '/tmp/safeguard-preflight/prior/claims-reader.mjs';
          const read = name => JSON.parse(readFileSync(`/tmp/safeguard-preflight/${name}`, 'utf8'));
          const snapshot = read('candidate-snapshot.json');
          const graph = read('candidate-claims.json');
          const manifest = read('candidate-manifest.json');
          const now = new Date();
          const filtered = filterLiveSnapshot(snapshot, { start:snapshot.windowStart, end:snapshot.windowEnd }, { now });
          const validation = validateClaimEvidenceGraph(graph, { now });
          legacyValidate(graph, { now });
          assert.equal(manifest.sha256, sha256(readFileSync('/tmp/safeguard-preflight/candidate-claims.json', 'utf8')));
          assert.ok(graph.claims.length > 0);
          assert.ok(graph.claims.every(c => c.kind !== 'fact' || (c.supportStatus === 'provisional' && c.supportConfidence === null)));
          const report = { checkedAt: now.toISOString(), candidateCommit:process.env.GITHUB_SHA, candidateDataValid:true,
            legacyClaimsReaderCompatible:true, writesPerformed:false, productionDeployed:false,
            snapshot: snapshotIdentity(snapshot), graph:graphIdentity(graph),
            events:filtered.events.length, sourceChecks:snapshot.meta.queryCount, successfulChecks:snapshot.meta.successfulQueries,
            claims:graph.summary, validation,
            caveat:'A real-source dry run, not production publication, exact live consumption, factual verification, database proof or sustained reliability.' };
          writeFileSync('/tmp/safeguard-preflight/preflight.json', JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Retain preflight and recovery evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safeguard-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: /tmp/safeguard-preflight/
          if-no-files-found: error
          retention-days: 30
