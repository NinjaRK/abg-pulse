name: Stage exact tested publication-date repair
on:
  push:
    branches: ['build/scouting-collector-20260921']
    paths: ['.github/workflows/stage-source-dates.yml', '.transfer/source-dates.b64']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore only the four exact locally tested files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/date-repair-proof
          python - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          encoded=Path('.transfer/source-dates.b64').read_text().strip()
          # Correct one known transfer transcription; the digest below is authoritative.
          encoded=encoded.replace('KTNf9jKZJJhm','KTNf9jKZJhm')
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='a909c7d3ba1d39925cadc0435269a384013534030551e52bc59ee92a26a8fd87','Compressed source digest mismatch'
          data=gzip.decompress(raw)
          assert len(data)<40000,'Unexpected transfer size'
          payload=json.loads(data)
          expected={
            'scouting/publication.py':'038629d88fb61240560485db79ca994c354fa5f37c47af38824ecbc6915d77e2',
            'tests/scouting/test_publication.py':'cfcb3e0b6f693ea5b4288343f4cf25b467e951f1eb85525566385c08b36ff041',
            'scouting/CODEX_HANDOFF.md':'66187b906d3390ebadef6bb4562b9e4c24fa500dccc4d8565b1cd51b7a39d1d0',
            'scouting/collector.py':'54d6a77f08f3f741284ac1dff9e1ea4bfee298ea4b07028c3163889aff177757'}
          assert set(payload['files'])==set(expected)-{'scouting/collector.py'}
          assert subprocess.check_output(['git','hash-object','scouting/collector.py'],text=True).strip()=='59744bcef29d5897c32aebeb66eff3880730fefc'
          text=Path('scouting/collector.py').read_text()
          assert len(payload['replacements'])==4
          for before,after in payload['replacements']:
              assert text.count(before)==1,'Original replacement must be unique'
              text=text.replace(before,after)
          payload['files']['scouting/collector.py']=text
          for path,content in payload['files'].items():
              assert hashlib.sha256(content.encode()).hexdigest()==expected[path],path
              Path(path).write_text(content)
          Path('/tmp/date-repair-proof/file-hashes.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
      - name: Run original product and expanded collector regressions
        run: |
          set -euo pipefail
          npm test > /tmp/date-repair-proof/product-tests.log 2>&1
          npm run check > /tmp/date-repair-proof/product-check.log 2>&1
          python -m unittest discover -s tests/scouting -v > /tmp/date-repair-proof/collector-tests.log 2>&1
          python -m scouting.regression_report > /tmp/date-repair-proof/before-after.json
          git diff --check
      - name: Match full final content tree then save only to the existing branch
        shell: bash
        run: |
          set -euo pipefail
          branch='build/scouting-collector-20260921'
          test "$GITHUB_REF_NAME" = "$branch"
          git add scouting/publication.py scouting/collector.py scouting/CODEX_HANDOFF.md tests/scouting/test_publication.py
          cp .git/index /tmp/date-repair-index
          GIT_INDEX_FILE=/tmp/date-repair-index git rm --cached --ignore-unmatch .transfer/source-dates.b64 .github/workflows/stage-source-dates.yml .github/workflows/inspect-source-dates.yml
          tree=$(GIT_INDEX_FILE=/tmp/date-repair-index git write-tree)
          test "$tree" = '5b794314a31e2deec1665ff31eb487c524046898'
          printf '%s\n' "$tree" > /tmp/date-repair-proof/FINAL_TREE.txt
          git archive --format=tar.gz "$tree" > /tmp/date-repair-proof/source.tar.gz
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ABG Pulse Source Verification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Preserve observed publication dates and explicit conflicts in source scouting'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/date-repair-proof/STAGING_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-date-repair-${{ github.run_id }}-${{ github.sha }}
          path: /tmp/date-repair-proof/
          retention-days: 30
