name: Apply and promote ABG Pulse regulator ingestion v6.2

on:
  push:
    branches:
      - sol/regulator-ingestion-v6-2
    paths:
      - '.build/regulator-v6.2.ready'

permissions:
  contents: write

jobs:
  apply-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic regulator integration patch
        run: node scripts/apply-regulator-ingestion-v6.2.mjs

      - name: Install without bootstrap side effects
        run: npm install --ignore-scripts

      - name: Run full product verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Verify regulator configuration and jobs remain governed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateRegulatorConfig, buildRegulatorJobs, regulatorRegistryRecords } from './lib/regulator-ingestion.mjs';
          const config = JSON.parse(readFileSync('config/regulator-sources.json', 'utf8'));
          const validation = validateRegulatorConfig(config);
          if (!validation.valid) throw new Error(JSON.stringify(validation.errors));
          if (validation.sources !== 8) throw new Error(`Expected 8 regulator sources; received ${validation.sources}`);
          const built = buildRegulatorJobs({ config, window: { start: '2026-09-01T00:00:00Z', end: '2026-09-02T00:00:00Z' }, fetchImpl: async () => { throw new Error('not invoked'); } });
          const records = regulatorRegistryRecords(config);
          if (built.jobs.length !== validation.sources || records.length !== validation.sources) throw new Error('Regulator jobs and governed source records disagree.');
          if (built.jobs.some((job) => job.tier !== 'tier0' || job.emptyIsValid !== true)) throw new Error('Regulator jobs lost Tier-0 or legitimate-empty semantics.');
          if (records.some((record) => !record.rightsStatus || !record.cadence || !record.url)) throw new Error('Regulator source governance metadata is incomplete.');
          console.log(JSON.stringify(validation, null, 2));
          NODE

      - name: Verify explicit failure semantics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { fetchRegulatorSource } from './lib/regulator-ingestion.mjs';
          const source = { id: 'test', name: 'Test', url: 'https://regulator.example/releases', authority: 'Test Regulator', tier: 'tier0', rightsStatus: 'metadata-and-link', cadence: 'on-demand' };
          const response = { ok: true, status: 200, headers: { get: () => 'text/html' }, text: async () => '<html><body>Access denied. Verify you are human.</body></html>' };
          await fetchRegulatorSource({ source, window: { start: '2026-09-01T00:00:00Z', end: '2026-09-02T00:00:00Z' }, fetchImpl: async () => response })
            .then(() => { throw new Error('Access challenge was incorrectly treated as healthy silence.'); })
            .catch((error) => {
              if (!/access challenge/.test(String(error.message))) throw error;
            });
          NODE

      - name: Refuse promotion if main moved outside candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Main moved after this candidate was created; refusing unsafe promotion.'
            exit 1
          }

      - name: Commit verified regulator ingestion and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/regulator-sources.json lib/regulator-ingestion.mjs tests/regulator-ingestion.test.mjs api/scan.js api/coverage.js api/health.js package.json data/release.json CHANGELOG.md
          git rm -f .build/regulator-v6.2.ready scripts/apply-regulator-ingestion-v6.2.mjs .github/workflows/apply-regulator-v6-2.yml
          git commit -m 'Add direct official regulator intelligence sources'
          git push origin HEAD:sol/regulator-ingestion-v6-2
          git push origin HEAD:main
