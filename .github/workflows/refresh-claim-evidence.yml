name: Refresh claim-level evidence graph

on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-claim-evidence.yml'
      - 'lib/claim-evidence.mjs'
      - 'scripts/build-claim-evidence-snapshot.mjs'
      - 'tests/claim-evidence.test.mjs'
      - 'api/claims.js'
      - 'tests/claims-api.test.mjs'
      - 'lib/live-snapshot.mjs'
      - 'tests/live-feed-integration.test.mjs'

permissions:
  contents: write

concurrency:
  group: abg-pulse-claim-evidence-refresh
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run claim and API regression tests
        run: |
          node --test tests/claim-evidence.test.mjs tests/claims-api.test.mjs
          node --check lib/claim-evidence.mjs
          node --check scripts/build-claim-evidence-snapshot.mjs
          node --check api/claims.js

      - name: Build evidence graph from the latest governed snapshot
        env:
          CLAIM_EVIDENCE_INPUT_URL: https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/live-snapshot.json
          CLAIM_EVIDENCE_INPUT_STALE_MINUTES: '180'
          CLAIM_EVIDENCE_FETCH_TIMEOUT_MS: '30000'
          UNSUPPORTED_MATERIALITY_FLOOR: '65'
          CLAIM_EVIDENCE_OUTPUT: out/claim-evidence.json
          CLAIM_EVIDENCE_MANIFEST_OUTPUT: out/claim-evidence.manifest.json
        run: node scripts/build-claim-evidence-snapshot.mjs

      - name: Verify graph integrity and zero unsupported material claims
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const text = readFileSync('out/claim-evidence.json', 'utf8');
          const graph = JSON.parse(text);
          const manifest = JSON.parse(readFileSync('out/claim-evidence.manifest.json', 'utf8'));
          const digest = createHash('sha256').update(text).digest('hex');
          if (digest !== manifest.sha256) throw new Error('Claim-evidence digest does not match its manifest.');
          if (graph.quality?.publishable !== true) throw new Error('Claim-evidence graph is not publishable.');
          if (Number(graph.quality?.unsupportedMaterialClaimCount) !== 0) throw new Error('Unsupported material factual claims remain.');
          if (!Array.isArray(graph.claims) || graph.claims.length < 1) throw new Error('No claims were generated.');
          if (!Array.isArray(graph.evidence) || graph.evidence.length < 1) throw new Error('No traceable evidence was generated.');
          const evidenceIds = new Set(graph.evidence.map((item) => item.id));
          const orphans = graph.claims.flatMap((claim) => (claim.evidenceIds || []).filter((id) => !evidenceIds.has(id)));
          if (orphans.length) throw new Error(`Orphan evidence references: ${orphans.slice(0, 10).join(', ')}`);
          if (manifest.sourceCommit !== graph.sourceCommit) throw new Error('Source commit lineage does not reconcile.');
          console.log(JSON.stringify({
            events: graph.summary.eventCount,
            claims: graph.summary.claimCount,
            facts: graph.summary.factClaimCount,
            interpretations: graph.summary.interpretationCount,
            evidence: graph.summary.evidenceCount,
            supportedFacts: graph.summary.supportedFactClaims,
            provisionalFacts: graph.summary.provisionalFactClaims,
            unsupportedFacts: graph.summary.unsupportedFactClaims,
            unsupportedMaterialClaims: graph.quality.unsupportedMaterialClaimCount,
            potentialContradictions: graph.quality.potentialContradictionCount,
            sourceCommit: graph.sourceCommit,
            digest
          }, null, 2));
          NODE

      - name: Publish graph to the non-deploying live-data branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Claim Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf /tmp/abg-pulse-claim-live-data
          git fetch origin live-data:refs/remotes/origin/live-data
          git worktree add -B live-data /tmp/abg-pulse-claim-live-data origin/live-data
          mkdir -p /tmp/abg-pulse-claim-live-data/data
          cp out/claim-evidence.json /tmp/abg-pulse-claim-live-data/data/claim-evidence.json
          cp out/claim-evidence.manifest.json /tmp/abg-pulse-claim-live-data/data/claim-evidence.manifest.json
          cd /tmp/abg-pulse-claim-live-data
          git add data/claim-evidence.json data/claim-evidence.manifest.json
          if git diff --cached --quiet; then
            echo 'Claim-evidence graph is unchanged.'
            exit 0
          fi
          git commit -m 'Refresh claim-level evidence graph [skip ci]'
          for attempt in $(seq 1 6); do
            if git push origin HEAD:live-data; then
              exit 0
            fi
            echo "Push attempt $attempt raced with another live-data publisher; rebasing."
            git fetch origin live-data
            git rebase origin/live-data
            sleep $((attempt * 5))
          done
          echo 'Could not publish claim-evidence graph after retries.'
          exit 1

      - name: Verify published graph is retrievable and fresh
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/data/claim-evidence.json'
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 30 -o /tmp/published-claim-evidence.json -w '%{http_code}' "$url" || true)
            if [ "$code" = '200' ]; then
              node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync('/tmp/published-claim-evidence.json', 'utf8'));
          if (graph.quality?.publishable !== true) throw new Error('Published graph is not marked publishable.');
          if (Number(graph.quality?.unsupportedMaterialClaimCount) !== 0) throw new Error('Published graph contains unsupported material claims.');
          if (!graph.sourceCommit) throw new Error('Published graph source commit is missing.');
          console.log(`Published ${graph.summary.claimCount} claims linked to ${graph.summary.evidenceCount} evidence records from ${graph.sourceCommit}.`);
          NODE
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code; retrying in 10 seconds."
            sleep 10
          done
          echo 'Published claim-evidence graph could not be retrieved.'
          exit 1

      - name: Upload immutable claim-evidence proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            out/claim-evidence.json
            out/claim-evidence.manifest.json
          if-no-files-found: error
          retention-days: 90
