name: Configure v6 API runtimes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-v6-api-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add explicit runtime limits for new evidence APIs
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'vercel.json';
          const config = JSON.parse(readFileSync(path, 'utf8'));
          config.functions = {
            ...(config.functions || {}),
            'api/scan.js': { ...(config.functions?.['api/scan.js'] || {}), maxDuration: 30 },
            'api/ingest.js': { ...(config.functions?.['api/ingest.js'] || {}), maxDuration: 15 },
            'api/social-ingest.js': { ...(config.functions?.['api/social-ingest.js'] || {}), maxDuration: 15 },
            'api/authoritative.js': { ...(config.functions?.['api/authoritative.js'] || {}), maxDuration: 15 },
            'api/claims.js': { ...(config.functions?.['api/claims.js'] || {}), maxDuration: 15 },
            'api/persist-claims.js': { ...(config.functions?.['api/persist-claims.js'] || {}), maxDuration: 60 },
            'api/corrections.js': { ...(config.functions?.['api/corrections.js'] || {}), maxDuration: 30 },
            'api/entity-source-coverage.js': { ...(config.functions?.['api/entity-source-coverage.js'] || {}), maxDuration: 10 },
            'api/deployment-status.js': { ...(config.functions?.['api/deployment-status.js'] || {}), maxDuration: 10 }
          };
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json valid')"
          git rm .github/workflows/configure-v6-api-runtimes.yml
      - name: Commit configuration
        run: |
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add vercel.json
          git commit -m 'Configure v6 evidence API runtimes'
          git push origin HEAD:main
