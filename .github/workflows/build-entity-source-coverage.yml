name: Build entity-to-source coverage graph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-entity-source-coverage.yml'
      - 'lib/entity-source-coverage.mjs'
      - 'scripts/build-entity-source-coverage.mjs'
      - 'data/entities.json'
      - 'data/source-registry.json'
      - 'config/official-sources.json'
      - 'config/queries.json'
      - 'config/authoritative-sources-wave1.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-entity-source-coverage
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run coverage-graph regression tests
        run: node --test tests/entity-source-coverage.test.mjs
      - name: Generate the coverage graph and integrity manifest
        run: node scripts/build-entity-source-coverage.mjs
      - name: Validate generated graph against the governed universe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync('data/entity-source-coverage.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('data/entity-source-coverage.manifest.json', 'utf8'));
          if (graph.summary.entityCount < 190) throw new Error(`Entity graph unexpectedly small: ${graph.summary.entityCount}`);
          if (graph.summary.priorityEntityCount < 42) throw new Error(`Priority universe unexpectedly small: ${graph.summary.priorityEntityCount}`);
          if (!Array.isArray(graph.rows) || graph.rows.length !== graph.summary.entityCount) throw new Error('Coverage rows do not reconcile to entity count.');
          if (!Array.isArray(graph.unresolvedReferences)) throw new Error('Unresolved source references are not exposed.');
          if (!manifest.sha256 || manifest.sha256.length !== 64) throw new Error('Coverage manifest digest is invalid.');
          console.log(JSON.stringify(graph.summary, null, 2));
          NODE
      - name: Run complete product regression suite
        run: npm test
      - name: Commit reproducible coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Coverage Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/entity-source-coverage.json data/entity-source-coverage.manifest.json
          if git diff --cached --quiet; then
            echo 'Coverage graph is unchanged.'
            exit 0
          fi
          git commit -m 'Regenerate entity-to-source coverage graph'
          git push origin HEAD:main
