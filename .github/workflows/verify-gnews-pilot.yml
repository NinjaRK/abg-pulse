name: Verify GNews pilot (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --ignore-scripts

      - name: Run product tests
        run: npm test

      - name: Require configured GNews credential
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GNEWS_API_KEY:-}"

      - name: Run read-only 24-hour GNews verification
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GNEWS_PILOT_HOURS: '24'
        run: node scripts/verify-gnews-pilot.mjs out/gnews-pilot-result.json

      - name: Check artifact contains metadata only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('out/gnews-pilot-result.json', 'utf8'));
          if (!Array.isArray(result.candidates)) throw new Error('Candidate metadata is missing.');
          if (result.candidates.some((item) => Object.hasOwn(item, 'content'))) {
            throw new Error('Provider article content must not be retained in this verification artifact.');
          }
          console.log(JSON.stringify({
            queryCount: result.queryCount,
            successfulQueries: result.successfulQueries,
            failedQueries: result.failedQueries,
            saturatedQueries: result.saturatedQueries.length,
            uniqueArticleCount: result.uniqueArticleCount,
            relevantArticleCount: result.relevantArticleCount,
            coverageStatus: result.coverageStatus
          }, null, 2));
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnews-pilot-verification
          path: out/gnews-pilot-result.json
          if-no-files-found: ignore
          retention-days: 14
