name: Promote verified authoritative source wave one

on:
  workflow_run:
    workflows:
      - Verify direct authoritative source wave one
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'sol/authoritative-source-wave1-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Locate and merge the verified pull request
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head 'sol/authoritative-source-wave1-v2' \
            --base main \
            --state open \
            --json number,isDraft \
            --jq 'map(select(.isDraft == false))[0].number // empty')
          if [ -z "$pr_number" ]; then
            echo 'No open non-draft authoritative-source PR found; nothing to merge.'
            exit 0
          fi
          gh pr checks "$pr_number" --repo "$GITHUB_REPOSITORY" --required || true
          gh pr merge "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --subject 'Implement direct authoritative source wave one adapters'
