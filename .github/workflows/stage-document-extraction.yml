name: Stage exact tested document extraction
on:
  push:
    branches: ['build/scouting-collector-20260921']
    paths: ['.github/workflows/stage-document-extraction.yml', '.transfer/document-extraction-*.b64']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply only the hash-verified locally tested source changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/document-build-proof
          python - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'.transfer/document-extraction-{i}.b64').read_text() for i in (1,2,3))
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='804373755f79ad0dca0d7fc834b5b426bb51053d55d98118c94441353fa9f912','Transfer digest mismatch'
          patch=gzip.decompress(raw)
          assert len(patch)==63623,'Unexpected source-patch size'
          target=Path('/tmp/document-build-proof/source.patch');target.write_bytes(patch)
          expected={
            '.github/workflows/verify-scouting-collector.yml':'1fe0ab9c32dc1ad96e16ec0f4715cbaa10aa72290122168acc370166fcf85d5a',
            'scouting/DOCUMENT_EXTRACTION.md':'fcb3c8d1627e4e276d74186a1ea424baf7b592275148e78300c56dc328fb086e',
            'scouting/README.md':'32c5752e99234defb0600f99c60bd8bb9822df4927f71a44c6aa1e377d0122f9',
            'scouting/collector.py':'663ae4339a90838a54776e0a4377574bb2b5b6fd5b2e4ca433444711a8d93396',
            'scouting/document_fixture_probe.py':'8dd458af320abebdea747de5d7fb275b87dec6a06c6c3e86fb226734549cae92',
            'scouting/document_worker.py':'a73f2b36216960de1c7291f0ab47d96a8986abb6916aaf657c3abe0f5f10895a',
            'scouting/documents.py':'dda24078200fbeed05a9658f1848d4c956bbfb1f3531b6f68b5719cd7c6dba3f',
            'scouting/requirements-documents.txt':'486e6e9896987bb544a1a301ada1d2330960e1c385c8803617c21b0e6529a4ea',
            'scouting/run_probe.py':'93702a821a4e1d01301ee4fb1b198a6724233d23711f0d27c12bb0d3c812ec2f',
            'tests/scouting/test_documents.py':'4638f75079a9a651fbc01963ebd3b1e6befdaa792e135b666ecd1789a8ef8f6e'}
          rows=subprocess.check_output(['git','apply','--numstat',str(target)],text=True)
          assert {r.split('\t')[-1] for r in rows.splitlines()}==set(expected),'Unexpected changed path'
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply',str(target)],check=True)
          for path,digest in expected.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          Path('/tmp/document-build-proof/file-hashes.json').write_text(json.dumps(expected,indent=2)+'\n')
          subprocess.run(['git','add','--',*expected],check=True)
          PY
      - name: Install only the exact hash-pinned PDF dependency
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r scouting/requirements-documents.txt
      - name: Run original product and full collector regression suites
        run: |
          set -euo pipefail
          npm test > /tmp/document-build-proof/product-tests.log 2>&1
          npm run check > /tmp/document-build-proof/product-check.log 2>&1
          python -m unittest discover -s tests/scouting -v > /tmp/document-build-proof/collector-tests.log 2>&1
          python -m scouting.regression_report > /tmp/document-build-proof/discovery-before-after.json
          git diff --cached --check
      - name: Verify full final tree and save only to the same review branch
        shell: bash
        run: |
          set -euo pipefail
          branch='build/scouting-collector-20260921'
          test "$GITHUB_REF_NAME" = "$branch"
          cp .git/index /tmp/document-build-index
          GIT_INDEX_FILE=/tmp/document-build-index git rm --cached --ignore-unmatch .transfer/document-extraction-1.b64 .transfer/document-extraction-2.b64 .transfer/document-extraction-3.b64 .github/workflows/stage-document-extraction.yml .github/workflows/prepare-document-tests.yml
          tree=$(GIT_INDEX_FILE=/tmp/document-build-index git write-tree)
          test "$tree" = '07d3e334e0bdce29262f704e7698553f2999997b'
          printf '%s\n' "$tree" > /tmp/document-build-proof/FINAL_TREE.txt
          git archive --format=tar.gz "$tree" > /tmp/document-build-proof/source.tar.gz
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'ABG Pulse Source Verification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add bounded article and PDF extraction with provenance and permission gates'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/document-build-proof/STAGING_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-build-${{ github.run_id }}-${{ github.sha }}
          path: /tmp/document-build-proof/
          if-no-files-found: error
          retention-days: 30
