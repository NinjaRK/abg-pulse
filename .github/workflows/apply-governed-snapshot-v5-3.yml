name: Apply ABG Pulse governed snapshot architecture

on:
  push:
    branches:
      - sol/governed-snapshot-v5-3
    paths:
      - '.bootstrap/governed-snapshot-v5.3.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out snapshot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and apply governed snapshot patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = Path('.bootstrap/governed-snapshot-v5.3.patch.gz.b64').read_text().strip()
          assert hashlib.sha256(encoded.encode()).hexdigest() == '266c619d63762d12ba59bb07fd46d5595640ad7d99926c258b3149088717651f'
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '5f5e2c656c3b08607757ab4764a05637900b0d89777390dfaa59b9f9097d04d5'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '9738289c728d954c9f6f6508fc6867ddc4f43181858574556c6056e46c2c866a'
          Path('/tmp/governed-snapshot-v5.3.patch').write_bytes(patch)
          print(f'Verified {len(patch)}-byte governed snapshot patch.')
          PY
          git apply --check /tmp/governed-snapshot-v5.3.patch
          git apply /tmp/governed-snapshot-v5.3.patch

      - name: Run full automated verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --check scripts/refresh-snapshot.mjs
          python -m json.tool package.json >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit verified snapshot architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/scan.js tests/scan.test.mjs scripts/refresh-snapshot.mjs .github/workflows/refresh-live-snapshot.yml package.json vercel.json
          git rm -f .bootstrap/governed-snapshot-v5.3.ready .bootstrap/governed-snapshot-v5.3.patch.gz.b64 .github/workflows/apply-governed-snapshot-v5-3.yml
          git commit -m 'Add governed scheduled snapshot architecture'
          git push origin HEAD:sol/governed-snapshot-v5-3
