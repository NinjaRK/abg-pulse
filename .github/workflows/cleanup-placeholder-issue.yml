name: Clean accidental placeholder issue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-placeholder-issue.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close only exact accidental placeholder issues
        shell: bash
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == "placeholder") | .number' \
            | while read -r number; do
                [ -n "$number" ] || continue
                gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment 'Closed automatically: this issue was created accidentally during connector discovery and contains no project work.'
              done
      - name: Remove this one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cleanup-placeholder-issue.yml
          git commit -m 'Remove completed placeholder issue cleanup'
          git push origin HEAD:main
