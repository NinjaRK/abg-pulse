name: Export governed snapshot branch

on:
  push:
    branches: [sol/governed-snapshot-v5-3]
    paths: ['.github/workflows/export-branch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=node_modules -czf /tmp/governed-snapshot-branch.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: governed-snapshot-branch-${{ github.sha }}
          path: /tmp/governed-snapshot-branch.tgz
          retention-days: 1
