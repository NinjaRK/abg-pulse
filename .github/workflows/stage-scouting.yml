name: Stage exact tested source-scouting collector
on:
  push:
    branches: ['build/scouting-collector-20260921']
    paths: ['.github/workflows/stage-scouting.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode only the exact eight locally tested new files
        run: |
          set -euo pipefail
          git diff --exit-code 9010adc06f361ad55adb3da21f95519b3a98febb HEAD -- . ':!.scouting-stage/**' ':!.github/workflows/stage-scouting.yml'
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.scouting-stage/part{i}.b64').read_text() for i in range(1,5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '60d40e965e25b6901f77a5004f1d850ae481935c11066cbf72959bdad892ea80'
          data = json.loads(lzma.decompress(compressed))
          allowed = {'scouting/README.md','scouting/__init__.py','scouting/collector.py','scouting/query_plan.py','scouting/regression_report.py','scouting/run_probe.py','scouting/sources.json','tests/scouting/test_collector.py'}
          assert set(data) == allowed
          for name, text in data.items():
              p = Path(name)
              assert not p.exists() and isinstance(text,str)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Run original product tests and collector failure cases
        run: |
          set -euo pipefail
          mkdir -p /tmp/scouting-stage-proof
          npm test > /tmp/scouting-stage-proof/product-tests.log 2>&1
          npm run check > /tmp/scouting-stage-proof/product-check.log 2>&1
          python -m unittest discover -s tests/scouting -v > /tmp/scouting-stage-proof/collector-tests.log 2>&1
          python -m scouting.regression_report > /tmp/scouting-stage-proof/before-after.json
          git diff --check
      - name: Verify candidate tree and save only to the review branch
        run: |
          set -euo pipefail
          git add scouting/README.md scouting/__init__.py scouting/collector.py scouting/query_plan.py scouting/regression_report.py scouting/run_probe.py scouting/sources.json tests/scouting/test_collector.py
          cp .git/index /tmp/scouting-clean-index
          GIT_INDEX_FILE=/tmp/scouting-clean-index git rm --cached .scouting-stage/part1.b64 .scouting-stage/part2.b64 .scouting-stage/part3.b64 .scouting-stage/part4.b64 .github/workflows/stage-scouting.yml
          tested_tree=$(GIT_INDEX_FILE=/tmp/scouting-clean-index git write-tree)
          test "$tested_tree" = '0a6babcc46ca7d57bf8ca5282d04beda81b4f0d9'
          printf '%s\n' "$tested_tree" > /tmp/scouting-stage-proof/TESTED_TREE.txt
          git config user.name 'ABG Pulse Source Verification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add exact tested candidate-preserving collector and rights-gated source register'
          git rev-parse HEAD > /tmp/scouting-stage-proof/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/scouting-stage-proof/source.tar.gz
          git push origin HEAD:build/scouting-collector-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scouting-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/scouting-stage-proof/
          retention-days: 30
          if-no-files-found: warn
