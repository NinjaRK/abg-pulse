name: Apply and verify ABG Pulse relevance hardening v5.4b

on:
  push:
    branches:
      - sol/relevance-hardening-v5-4
    paths:
      - '.bootstrap/relevance-v5.4.ready2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out relevance-hardening branch
        uses: actions/checkout@v4
        with:
          ref: sol/relevance-hardening-v5-4
          fetch-depth: 0

      - name: Decode and apply corrected reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/relevance-v5.4.patch2.gz.b64 > /tmp/relevance-v5.4.patch.gz
          gzip -dc /tmp/relevance-v5.4.patch.gz > /tmp/relevance-v5.4.patch
          git apply --check /tmp/relevance-v5.4.patch
          git apply /tmp/relevance-v5.4.patch

      - name: Run complete automated suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit only verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core.mjs api/scan.js tests
          git rm -f .bootstrap/relevance-v5.4.patch2.gz.b64 .bootstrap/relevance-v5.4.ready2
          git commit -m 'Harden live relevance, public sentiment and event freshness'
          git push origin HEAD:sol/relevance-hardening-v5-4
