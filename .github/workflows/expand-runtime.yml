name: Expand ABG Pulse runtime source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-runtime.yml'
      - '.bootstrap/runtime.b64.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore complete ABG Pulse runtime
        run: node bootstrap.mjs

      - name: Commit restored source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api config data assets
          if git diff --cached --quiet; then
            echo "Runtime source is already complete."
            exit 0
          fi
          git commit -m "Expand complete ABG Pulse runtime source"
          git push
