name: Verify registry and browser acceptance
on:
  pull_request:
    branches: [main]
    paths: ['data/entity-history.json', 'lib/entity-history.mjs', 'lib/reliability-window.mjs', 'registry.html', 'registry.mjs', 'scripts/serve.mjs', 'scripts/production-preflight.mjs', 'tests/**', '.github/workflows/verify-entity-history-browser.yml']
  push:
    branches: [main, 'sol/entity-history-and-acceptance-20260908']
    paths: ['data/entity-history.json', 'lib/entity-history.mjs', 'lib/reliability-window.mjs', 'registry.html', 'registry.mjs', 'scripts/serve.mjs', 'scripts/production-preflight.mjs', 'tests/**', '.github/workflows/verify-entity-history-browser.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run all source tests and syntax checks
        run: |
          npm test
          npm run check
          node --check registry.mjs
          node --check lib/entity-history.mjs
          node --check lib/reliability-window.mjs
          node --check scripts/serve.mjs
          node --check scripts/production-preflight.mjs
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run local browser journey and record separate production observation
        env:
          BROWSER_PROOF_DIR: ${{ runner.temp }}/browser-proof
        run: python tests/browser-acceptance.py
      - name: Preserve reproducible browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registry-browser-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/browser-proof/
          if-no-files-found: warn
          retention-days: 30
