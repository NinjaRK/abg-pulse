name: Apply and promote ABG Pulse Tier-0 ingestion v5.5

on:
  push:
    branches:
      - sol/tier0-ingestion-v5-5
    paths:
      - '.build/tier0-v5.5.ready'

permissions:
  contents: write

jobs:
  apply-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic Tier-0 integration patch
        run: node scripts/apply-tier0-ingestion.mjs

      - name: Install without bootstrap side effects
        run: npm install --ignore-scripts

      - name: Run full product verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateTier0Config, buildTier0Jobs } from './lib/tier0-ingestion.mjs';
          import { tier0RegistryRecords } from './lib/tier0-registry.mjs';
          const entities = JSON.parse(readFileSync('data/entities.json', 'utf8'));
          const config = JSON.parse(readFileSync('config/tier0-sources.json', 'utf8'));
          const validation = validateTier0Config(config, entities);
          if (!validation.valid) throw new Error(JSON.stringify(validation.errors));
          if (validation.nseInstruments !== 10) throw new Error(`Expected 10 verified NSE instruments; received ${validation.nseInstruments}`);
          if (validation.secRegistrants !== 1) throw new Error(`Expected one SEC registrant; received ${validation.secRegistrants}`);
          const records = tier0RegistryRecords(config);
          if (records.length !== validation.configuredJobs) throw new Error('Tier-0 registry and adapter configuration disagree.');
          const built = buildTier0Jobs({ config, entities, window: { start: '2026-09-01T00:00:00Z', end: '2026-09-02T00:00:00Z' }, fetchImpl: async () => { throw new Error('not invoked'); } });
          if (built.jobs.length !== validation.configuredJobs) throw new Error('Tier-0 job builder count mismatch.');
          console.log(JSON.stringify(validation, null, 2));
          NODE

      - name: Refuse promotion if main moved outside candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Main moved after the candidate branch was created; refusing unsafe promotion.'
            exit 1
          }

      - name: Commit verified integration and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add config/tier0-sources.json lib/tier0-ingestion.mjs lib/tier0-registry.mjs tests/tier0-ingestion.test.mjs api/scan.js api/coverage.js api/health.js package.json
          git rm -f .build/tier0-v5.5.ready scripts/apply-tier0-ingestion.mjs .github/workflows/apply-tier0-v5-5.yml
          git commit -m 'Add direct NSE and SEC Tier-0 ingestion'
          git push origin HEAD:sol/tier0-ingestion-v5-5
          git push origin HEAD:main
