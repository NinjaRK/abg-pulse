name: Refresh direct authoritative source wave one

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-authoritative-wave1.yml'
      - 'config/authoritative-sources-wave1.json'
      - 'lib/authoritative-sources.mjs'
      - 'scripts/refresh-authoritative-wave1.mjs'

permissions:
  contents: write

concurrency:
  group: abg-pulse-authoritative-wave1
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh direct official disclosures
        env:
          AUTHORITATIVE_LOOKBACK_HOURS: '720'
          AUTHORITATIVE_MIN_SUCCESS_RATIO: '0.25'
          AUTHORITATIVE_TIMEOUT_MS: '15000'
          AUTHORITATIVE_OUTPUT: out/authoritative-wave1.json
          AUTHORITATIVE_MANIFEST_OUTPUT: out/authoritative-wave1.manifest.json
          AUTHORITATIVE_SOURCE_USER_AGENT: 'ABG-Pulse/1.0 (public-source monitor; abg-pulse@users.noreply.github.com)'
        run: node scripts/refresh-authoritative-wave1.mjs
      - name: Publish provenance-rich data to live-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Authoritative Source Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf /tmp/abg-pulse-authoritative-live-data
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data:refs/remotes/origin/live-data
            git worktree add -B live-data /tmp/abg-pulse-authoritative-live-data origin/live-data
          else
            git worktree add --detach /tmp/abg-pulse-authoritative-live-data
            cd /tmp/abg-pulse-authoritative-live-data
            git switch --orphan live-data
            git rm -rf . >/dev/null 2>&1 || true
            cd "$GITHUB_WORKSPACE"
          fi
          mkdir -p /tmp/abg-pulse-authoritative-live-data/data
          cp out/authoritative-wave1.json /tmp/abg-pulse-authoritative-live-data/data/authoritative-wave1.json
          cp out/authoritative-wave1.manifest.json /tmp/abg-pulse-authoritative-live-data/data/authoritative-wave1.manifest.json
          if [ ! -f /tmp/abg-pulse-authoritative-live-data/vercel.json ]; then
            cat > /tmp/abg-pulse-authoritative-live-data/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": { "deploymentEnabled": { "live-data": false } }
          }
          EOF
          fi
          cd /tmp/abg-pulse-authoritative-live-data
          git add data/authoritative-wave1.json data/authoritative-wave1.manifest.json vercel.json
          if git diff --cached --quiet; then
            echo 'No authoritative-source changes to publish.'
            exit 0
          fi
          git commit -m "Refresh direct authoritative disclosures [skip ci]"
          git push origin HEAD:live-data
      - name: Verify published authoritative snapshot
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/data/authoritative-wave1.json'
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 30 -o /tmp/published-authoritative.json -w '%{http_code}' "$url" || true)
            if [ "$code" = '200' ]; then
              node --input-type=module <<'NODE'
              import { readFileSync } from 'node:fs';
              const payload = JSON.parse(readFileSync('/tmp/published-authoritative.json', 'utf8'));
              if (!Array.isArray(payload.records)) throw new Error('Published authoritative records are missing.');
              if (!Array.isArray(payload.sourceChecks)) throw new Error('Published source checks are missing.');
              if (!payload?.source?.commitSha) throw new Error('Published provenance is missing.');
              if (payload.quality?.publishable !== true) throw new Error('Published snapshot is not marked publishable.');
              console.log(JSON.stringify({
                generatedAt: payload.generatedAt,
                sources: payload.sourceCount,
                successfulSources: payload.successfulSourceCount,
                failedSources: payload.failedSourceCount,
                records: payload.recordCount,
                sourceCommit: payload.source.commitSha
              }, null, 2));
              NODE
              exit 0
            fi
            sleep 10
          done
          echo 'Published authoritative snapshot could not be retrieved.'
          exit 1
      - name: Upload immutable refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-wave1-${{ github.run_id }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 30
