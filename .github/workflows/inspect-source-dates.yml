name: Inspect source publication date markup
on:
  push:
    branches: ['build/scouting-collector-20260921']
    paths: ['.github/workflows/inspect-source-dates.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read bounded date-only metadata using the existing restricted transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-dates
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          from datetime import datetime,timezone
          from scouting.collector import Document,PublicTransport
          sources={s['id']:s for s in json.loads(Path('scouting/sources.json').read_text())['sources']}
          targets=[('S003','https://investors.novelis.com/news-events/press-releases/detail/1425/novelis-reports-first-quarter-fiscal-year-2027-results'),('S005','https://www.ultratechcement.com/corporate/media/press-releases/financial-results-q1fy24'),('S017','https://www.sebi.gov.in/enforcement/orders/sep-2026/interim-order-in-the-matter-of-kore-digital-limited_104570.html')]
          report={'observedAt':datetime.now(timezone.utc).isoformat(),'commit':os.environ.get('GITHUB_SHA'),'productionWrites':False,'fullTextRetained':False,'sources':[]}
          for sid,url in targets:
              s=sources[sid];t=PublicTransport(s['allowedHosts'])
              row={'sourceId':sid,'url':url,'dateNodes':[]}
              try:
                  assert s['probeMode']=='public_metadata_only'
                  final,headers,body=t.get(url)
                  nodes=list(Document(body.decode('utf-8','replace')).root.descendants())
                  for n in nodes:
                      text=n.text()
                      date=re.search(r'\b(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\s+\d{1,2}(?:st|nd|rd|th)?,?\s+20\d{2}\b|\b\d{1,2}(?:st|nd|rd|th)?\s+(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?),?\s+20\d{2}\b',text,re.I)
                      temporal=any(k in n.attrs for k in ['datetime','data-date']) or bool(re.search(r'date|time',n.attrs.get('class','')+' '+n.attrs.get('itemprop',''),re.I))
                      if (temporal and len(text)<200) or (date and len(text)<80):
                          row['dateNodes'].append({'tag':n.tag,'attrs':{k:v[:120] for k,v in n.attrs.items() if k in ['id','class','datetime','itemprop','data-date']},'dateText':date.group(0) if date else None,'parent':{'tag':n.parent.tag,'attrs':{k:v[:120] for k,v in n.parent.attrs.items() if k in ['id','class']}}})
                  row['dateNodes']=row['dateNodes'][:40]
                  row['status']='metadata_observed'
              except Exception as exc:row.update(status='unavailable',error=getattr(exc,'code',type(exc).__name__))
              row['httpObservations']=t.records;report['sources'].append(row)
          Path('/tmp/source-dates/report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-date-markup-${{ github.run_id }}-${{ github.sha }}
          path: /tmp/source-dates/
          retention-days: 30
