name: Apply and promote ABG Pulse release gates v6.1

on:
  push:
    branches:
      - sol/release-gates-v6-1
    paths:
      - '.build/release-gates-v6.1.ready'

permissions:
  contents: write

jobs:
  apply-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic release-gate integration patch
        run: node scripts/apply-release-gates-v6.1.mjs

      - name: Install without bootstrap side effects
        run: npm install --ignore-scripts

      - name: Run full product verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Validate the production verification contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('data/release.json', 'utf8'));
          const workflow = readFileSync('.github/workflows/verify-production-release.yml', 'utf8');
          const required = ['/', '/api/health', '/api/scan', '/api/coverage', '/api/dependability', '/api/source-health', '/api/progress'];
          for (const endpoint of required) {
            if (!release.requiredEndpoints.includes(endpoint)) throw new Error(`Release manifest missing ${endpoint}`);
          }
          for (const phrase of [
            'EXPECTED_SHA',
            'Production commit provenance mismatch',
            'queryPlan',
            'tier0',
            'evidenceChain',
            'mustKnowEligible',
            'objectiveAchieved',
            'release-manifest.json'
          ]) {
            if (!workflow.includes(phrase)) throw new Error(`Production workflow missing ${phrase}`);
          }
          if (release.evidenceRetentionDays !== 90) throw new Error('Release evidence retention must be 90 days.');
          console.log(JSON.stringify(release, null, 2));
          NODE

      - name: Refuse promotion if main moved outside candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Main moved after the candidate branch was created; refusing unsafe promotion.'
            exit 1
          }

      - name: Commit verified release gate and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/verify-production-release.yml data/release.json api/release.js api/health.js package.json CHANGELOG.md
          git rm -f .build/release-gates-v6.1.ready scripts/apply-release-gates-v6.1.mjs .github/workflows/apply-release-gates-v6-1.yml
          git commit -m 'Add exact-commit production intelligence release gate'
          git push origin HEAD:sol/release-gates-v6-1
          git push origin HEAD:main
