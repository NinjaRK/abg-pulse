name: Verify ABG Pulse production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production.yml'
      - 'index.html'
      - 'deploy-index.html'
      - 'app.js'
      - 'styles.css'
      - 'core.mjs'
      - 'official.mjs'
      - 'api/**'
      - 'config/**'
      - 'data/**'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-main
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://abg-pulse-intelligence-v4.vercel.app
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Wait for this exact Git-connected deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 32); do
            home_code=$(curl -L -sS --max-time 25 -o /tmp/home.html -w '%{http_code}' "$PRODUCTION_URL" || true)
            health_code=$(curl -L -sS --max-time 25 -o /tmp/health.json -w '%{http_code}' "$PRODUCTION_URL/api/health" || true)
            deployed_sha=$(node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              try {
                const payload = JSON.parse(readFileSync('/tmp/health.json', 'utf8'));
                process.stdout.write(payload?.deployment?.commitSha || '');
              } catch { process.stdout.write(''); }
            " || true)
            if [ "$home_code" = "200" ] \
              && grep -qi 'ABG Pulse' /tmp/home.html \
              && [ "$health_code" = "200" ] \
              && [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
              echo "Exact production commit $EXPECTED_SHA is live on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: homepage=$home_code health=$health_code deployed_sha=${deployed_sha:-missing} expected=$EXPECTED_SHA; retrying in 15 seconds."
            sleep 15
          done
          echo "The exact production commit did not become healthy in time."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Verify health and governed entity universe
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/health.json', 'utf8'));
          const actual = payload?.entityUniverse?.actual || {};
          const expectedSha = process.env.EXPECTED_SHA;
          if (!['ok', 'degraded'].includes(payload.status)) throw new Error(`Unexpected health status: ${payload.status}`);
          if (payload?.deployment?.commitSha !== expectedSha) throw new Error(`Deployment mismatch: expected ${expectedSha}; received ${payload?.deployment?.commitSha}`);
          if (payload?.entityUniverse?.reconciled !== true) throw new Error('Official entity universe is not reconciled.');
          if (actual.officialCompanies !== 42) throw new Error(`Expected 42 official companies; received ${actual.officialCompanies}`);
          if (actual.officialLeadership !== 40) throw new Error(`Expected 40 official leadership entries; received ${actual.officialLeadership}`);
          if (actual.totalEntities < 190) throw new Error(`Entity graph unexpectedly small: ${actual.totalEntities}`);
          console.log(JSON.stringify({
            status: payload.status,
            mode: payload.mode,
            deploymentCommit: payload.deployment.commitSha,
            officialCompanies: actual.officialCompanies,
            officialLeadership: actual.officialLeadership,
            totalEntities: actual.totalEntities,
            databaseConfigured: payload?.configured?.database
          }, null, 2));
          NODE

      - name: Verify live scan returns valid intelligence JSON
        shell: bash
        run: |
          set -euo pipefail
          scan_ok=false
          for attempt in $(seq 1 8); do
            code=$(curl -L -sS --max-time 100 -o /tmp/scan.json -w '%{http_code}' "$PRODUCTION_URL/api/scan" || true)
            if [ "$code" = "200" ]; then
              scan_ok=true
              break
            fi
            echo "Attempt $attempt: scan returned HTTP $code; retrying in 15 seconds."
            cat /tmp/scan.json 2>/dev/null || true
            sleep 15
          done
          if [ "$scan_ok" != "true" ]; then
            echo "Live scan did not return HTTP 200."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/scan.json', 'utf8'));
          if (!Array.isArray(payload.events)) throw new Error('Scan response has no events array.');
          if (!payload.meta || typeof payload.meta !== 'object') throw new Error('Scan response has no metadata.');
          if (!Number.isFinite(payload.meta.queryCount) || payload.meta.queryCount < 1) throw new Error('No source checks were attempted.');
          if (!Number.isFinite(payload.meta.successfulQueries)) throw new Error('Successful source count missing.');
          if (!Array.isArray(payload.meta.sourceChecks)) throw new Error('Source-health detail missing.');
          console.log(JSON.stringify({
            totalChecks: payload.meta.queryCount,
            successfulChecks: payload.meta.successfulQueries,
            failedChecks: payload.meta.queryCount - payload.meta.successfulQueries,
            rawArticleCount: payload.meta.rawArticleCount,
            relevantArticleCount: payload.meta.articleCount,
            eventCount: payload.events.length,
            registryReconciled: payload.meta.registryReconciled
          }, null, 2));
          NODE

      - name: Verify objective Job Meter endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fS --max-time 45 "$PRODUCTION_URL/api/progress" -o /tmp/progress.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/progress.json', 'utf8'));
          if (!Number.isFinite(payload.completion)) throw new Error('Job Meter completion percentage missing.');
          if (!Array.isArray(payload.milestones) || payload.milestones.length < 10) throw new Error('Milestone evidence is incomplete.');
          console.log(JSON.stringify({ completion: payload.completion, milestones: payload.milestones.length }, null, 2));
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abg-pulse-production-verification-${{ github.sha }}
          path: |
            /tmp/home.html
            /tmp/health.json
            /tmp/scan.json
            /tmp/progress.json
          if-no-files-found: warn
          retention-days: 30
