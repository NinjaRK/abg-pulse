name: Apply and verify ABG Pulse relevance hardening v5.4e

on:
  push:
    branches:
      - sol/relevance-hardening-v5-4
    paths:
      - '.bootstrap/relevance-v5.4.ready5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out relevance-hardening branch
        uses: actions/checkout@v4
        with:
          ref: sol/relevance-hardening-v5-4
          fetch-depth: 0

      - name: Restore operational source files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/ops-v5.4.chunk.* | base64 --decode > /tmp/abg-ops-v5.4.tar.gz
          echo 'bbe5b5ab9624e9ff3f2898dcb93fb653944c6ffef482934ffd9b410acb2598ba  /tmp/abg-ops-v5.4.tar.gz' | sha256sum --check
          tar -xzf /tmp/abg-ops-v5.4.tar.gz -C .
          test -f db/schema.sql
          test -f scripts/generate_db_seed.mjs
          test -f workflows/n8n-abg-pulse.json
          test -f workflows/n8n-social-listening.json

      - name: Reconstruct and apply reviewed relevance patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/relevance-v5.4.chunk.* | base64 --decode > /tmp/relevance-v5.4.patch.gz
          gzip -dc /tmp/relevance-v5.4.patch.gz > /tmp/relevance-v5.4.patch
          git apply --check /tmp/relevance-v5.4.patch
          git apply /tmp/relevance-v5.4.patch
          sed -i "s/job meter is evidence-weighted and currently reports 37%/job meter is evidence-weighted and currently reports 40%/" tests/progress.test.mjs
          sed -i "s/assert.equal(completion(plan), 37);/assert.equal(completion(plan), 40);/" tests/progress.test.mjs
          sed -i "s/jobCompletion !== 37/jobCompletion !== 40/" tests/validate-data.mjs
          sed -i "s/expected 37%/expected 40%/" tests/validate-data.mjs

      - name: Generate governed database seed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate_db_seed.mjs
          test -s db/seed.sql

      - name: Run complete automated suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit only verified source changes and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core.mjs api/scan.js tests db scripts workflows .env.example .gitignore
          git rm -f .bootstrap/relevance-v5.4* .bootstrap/ops-v5.4* .github/workflows/apply-relevance-v5-4*.yml
          git commit -m 'Harden live relevance and restore operational source assets'
          git push origin HEAD:sol/relevance-hardening-v5-4
