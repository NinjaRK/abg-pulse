name: Record verified claim-evidence progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record-claim-evidence-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-claim-evidence-progress
  cancel-in-progress: false

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Retrieve the published claim-evidence proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/claim-proof
          curl -L -fS --retry 8 --retry-delay 10 --max-time 60 \
            'https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/data/claim-evidence.json' \
            -o /tmp/claim-proof/claim-evidence.json
          curl -L -fS --retry 8 --retry-delay 10 --max-time 60 \
            'https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/data/claim-evidence.manifest.json' \
            -o /tmp/claim-proof/claim-evidence.manifest.json

      - name: Validate evidence and update only earned progress
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync, writeFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync as writeJson } from 'node:fs';

          const graphText = readFileSync('/tmp/claim-proof/claim-evidence.json', 'utf8');
          const graph = JSON.parse(graphText);
          const manifest = JSON.parse(readFileSync('/tmp/claim-proof/claim-evidence.manifest.json', 'utf8'));
          const digest = createHash('sha256').update(graphText).digest('hex');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(digest === manifest.sha256, 'Published claim graph does not match its integrity manifest.');
          assert(graph.quality?.publishable === true, 'Published claim graph did not pass its publication gate.');
          assert(Number(graph.quality?.unsupportedMaterialClaimCount) === 0, 'Unsupported material factual claims remain.');
          assert(Number(graph.summary?.eventCount) >= 1, 'No events were processed into the claim graph.');
          assert(Number(graph.summary?.factClaimCount) >= 1, 'No factual claims were generated.');
          assert(Number(graph.summary?.evidenceCount) >= 1, 'No traceable evidence records were generated.');
          assert(typeof graph.sourceCommit === 'string' && graph.sourceCommit.length >= 7, 'Governed snapshot source commit is missing.');
          try {
            execFileSync('git', ['cat-file', '-e', `${graph.sourceCommit}^{commit}`], { stdio: 'ignore' });
          } catch {
            throw new Error(`Governed snapshot source commit is not present in repository history: ${graph.sourceCommit}`);
          }

          const planPath = 'data/build-milestones.json';
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const milestone = (plan.milestones || []).find((item) => item.id === 'M4');
          assert(milestone, 'Persistent evidence milestone M4 is missing.');
          const evidenceLine = `Operational claim graph published from governed snapshot ${graph.sourceCommit}: ${graph.summary.factClaimCount} factual claims, ${graph.summary.evidenceCount} traceable evidence records, and zero unsupported material claims.`;
          milestone.completion = Math.max(Number(milestone.completion || 0), 30);
          milestone.implementationCompletion = Math.max(Number(milestone.implementationCompletion || 0), 60);
          milestone.status = milestone.status === 'complete' ? 'complete' : 'in_progress';
          milestone.evidence = Array.isArray(milestone.evidence) ? milestone.evidence : [];
          if (!milestone.evidence.includes(evidenceLine)) milestone.evidence.push(evidenceLine);
          milestone.nextAction = 'Connect production Postgres, persist raw records and claims, add authenticated correction decisions, propagate corrections and prove backup/restore.';

          plan.updatedAt = new Date().toISOString();
          plan.programme = plan.programme || {};
          plan.programme.lastEvidenceUpdate = {
            ...(plan.programme.lastEvidenceUpdate || {}),
            updatedAt: plan.updatedAt,
            claimEvidence: {
              graphGeneratedAt: graph.generatedAt,
              sourceCommit: graph.sourceCommit,
              eventCount: graph.summary.eventCount,
              factClaimCount: graph.summary.factClaimCount,
              evidenceCount: graph.summary.evidenceCount,
              supportedFactClaims: graph.summary.supportedFactClaims,
              provisionalFactClaims: graph.summary.provisionalFactClaims,
              unsupportedFactClaims: graph.summary.unsupportedFactClaims,
              unsupportedMaterialClaimCount: graph.quality.unsupportedMaterialClaimCount,
              potentialContradictionCount: graph.quality.potentialContradictionCount,
              manifestSha256: manifest.sha256
            }
          };
          writeJson(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Re-run Job Meter integrity and complete regressions
        run: |
          node --test tests/claim-evidence.test.mjs tests/claims-api.test.mjs
          node --test tests/progress-meter.test.mjs tests/progress.test.mjs
          npm test
          node tests/validate-data.mjs

      - name: Commit only evidence-backed progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/build-milestones.json
          if git diff --cached --quiet; then
            echo 'Job Meter already records this claim-evidence proof.'
            exit 0
          fi
          git commit -m 'Record verified claim-level evidence capability'
          git push origin HEAD:main

      - name: Upload immutable proof used for the progress change
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-progress-proof-${{ github.run_id }}
          path: /tmp/claim-proof/
          if-no-files-found: warn
          retention-days: 90
