name: Apply ABG Pulse precision hardening

on:
  push:
    branches:
      - sol/precision-hardening-v5-2
    paths:
      - '.bootstrap/precision-v5.2.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply precision patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/precision-v5.2.b64.* | base64 --decode > /tmp/precision-v5.2.patch.gz
          gzip -dc /tmp/precision-v5.2.patch.gz > /tmp/precision-v5.2.patch
          git apply --check /tmp/precision-v5.2.patch
          git apply /tmp/precision-v5.2.patch

      - name: Run full automated verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core.mjs api/scan.js tests package.json CHANGELOG.md data/release.json
          git rm -f .bootstrap/precision-v5.2.ready .bootstrap/precision-v5.2.b64.*
          git commit -m 'Harden live relevance and classification precision'
          git push origin HEAD:sol/precision-hardening-v5-2
