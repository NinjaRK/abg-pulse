name: Apply and promote ABG Pulse Trust Centre v6.3

on:
  push:
    branches:
      - sol/trust-centre-v6-3
    paths:
      - '.build/trust-centre-v6.3.ready'

permissions:
  contents: write

jobs:
  apply-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic Trust Centre integration patch
        run: node scripts/apply-trust-centre-v6.3.mjs

      - name: Install without bootstrap side effects
        run: npm install --ignore-scripts

      - name: Run full product verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Verify Trust Centre release contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('trust.html', 'utf8');
          const vercel = JSON.parse(readFileSync('vercel.json', 'utf8'));
          const release = JSON.parse(readFileSync('data/release.json', 'utf8'));
          const health = readFileSync('api/health.js', 'utf8');
          const productionWorkflow = readFileSync('.github/workflows/verify-production-release.yml', 'utf8');
          if (!vercel.rewrites.some((rule) => rule.source === '/trust' && rule.destination === '/trust.html')) throw new Error('Trust route is not configured.');
          if (!release.requiredEndpoints.includes('/trust') || !release.requiredEndpoints.includes('/api/release')) throw new Error('Release manifest does not govern every Trust Centre dependency.');
          if (!health.includes("trustCentre: '/trust'")) throw new Error('Health endpoint does not advertise the Trust Centre.');
          for (const phrase of ['Can I trust today’s brief?', 'Operational, not fully proven', 'What remains unproven', 'Do not rely on silence']) {
            if (!html.includes(phrase)) throw new Error(`Trust Centre missing ${phrase}`);
          }
          for (const phrase of ['evidence/trust.html', 'evidence/release.json', 'Verify Trust Centre clarity']) {
            if (!productionWorkflow.includes(phrase)) throw new Error(`Production verification missing ${phrase}`);
          }
          console.log(JSON.stringify({ version: release.version, route: '/trust', checks: release.requiredAssertions.length }, null, 2));
          NODE

      - name: Refuse promotion if main moved outside candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Main moved after this candidate was created; refusing unsafe promotion.'
            exit 1
          }

      - name: Commit verified Trust Centre and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add trust.html tests/trust-centre.test.mjs vercel.json package.json data/release.json .github/workflows/verify-production-release.yml api/health.js CHANGELOG.md
          git rm -f .build/trust-centre-v6.3.ready scripts/apply-trust-centre-v6.3.mjs .github/workflows/apply-trust-centre-v6-3.yml
          git commit -m 'Add world-class transparent Trust Centre'
          git push origin HEAD:sol/trust-centre-v6-3
          git push origin HEAD:main
