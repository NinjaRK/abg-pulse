name: Apply hard source timeouts

on:
  push:
    branches:
      - sol/hard-source-timeouts-v6-1-2
    paths:
      - '.github/workflows/apply-hard-source-timeouts.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: sol/hard-source-timeouts-v6-1-2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace advisory abort with a hard wall-clock timeout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('api/scan.js')
          source = path.read_text()
          old = '''async function runWithTimeout(run, milliseconds = 8500) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), milliseconds);
            try {
              return await run(controller.signal);
            } finally {
              clearTimeout(timer);
            }
          }'''
          new = '''export async function runWithTimeout(run, milliseconds = 8500) {
            const controller = new AbortController();
            let timer;
            const timeout = new Promise((_, reject) => {
              timer = setTimeout(() => {
                controller.abort();
                const error = new Error(`Source check exceeded ${milliseconds}ms`);
                error.code = 'source_timeout';
                reject(error);
              }, milliseconds);
            });
            const work = Promise.resolve().then(() => run(controller.signal));
            try {
              return await Promise.race([work, timeout]);
            } finally {
              clearTimeout(timer);
            }
          }'''
          if old not in source:
              raise SystemExit('Expected runWithTimeout implementation not found; refusing an unsafe patch.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Add deterministic timeout regression test
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/source-timeout.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { runWithTimeout } from '../api/scan.js';

          test('source timeout is a hard wall-clock bound even when work ignores AbortSignal', async () => {
            let capturedSignal;
            const startedAt = Date.now();
            await assert.rejects(
              runWithTimeout((signal) => {
                capturedSignal = signal;
                return new Promise(() => {});
              }, 25),
              (error) => error?.code === 'source_timeout' && /25ms/.test(error.message)
            );
            const elapsed = Date.now() - startedAt;
            assert.equal(capturedSignal.aborted, true);
            assert.ok(elapsed < 250, `Hard timeout took ${elapsed}ms.`);
          });

          test('source timeout returns successful work and clears the timer', async () => {
            const value = await runWithTimeout(async (signal) => {
              assert.equal(signal.aborted, false);
              return 'healthy';
            }, 100);
            assert.equal(value, 'healthy');
          });
          TEST

      - name: Run all gates
        run: |
          npm install --ignore-scripts
          npm test
          npm run check

      - name: Commit verified hardening and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/scan.js tests/source-timeout.test.mjs
          git rm .github/workflows/apply-hard-source-timeouts.yml
          git commit -m 'Enforce hard wall-clock source timeouts'
          git push origin HEAD:sol/hard-source-timeouts-v6-1-2
