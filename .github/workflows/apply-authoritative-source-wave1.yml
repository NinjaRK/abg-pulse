name: Apply authoritative-source wave 1

on:
  push:
    branches:
      - sol/authoritative-source-wave1
    paths:
      - '.github/workflows/apply-authoritative-source-wave1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add governed authoritative adapters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
