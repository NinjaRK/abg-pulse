name: Capture ABG Pulse daily production evidence

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abg-pulse-daily-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://abg-pulse-intelligence-v4.vercel.app
    steps:
      - name: Define the previous UTC day
        shell: bash
        run: |
          echo "WINDOW_END=$(date -u +%Y-%m-%dT00:00:00.000Z)" >> "$GITHUB_ENV"
          echo "WINDOW_START=$(date -u -d '1 day ago' +%Y-%m-%dT00:00:00.000Z)" >> "$GITHUB_ENV"
          echo "EVIDENCE_DATE=$(date -u -d '1 day ago' +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Capture every endpoint without losing failure bodies
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          capture() {
            name="$1"
            url="$2"
            timeout="$3"
            code=$(curl -L -sS --retry 3 --retry-delay 5 --max-time "$timeout" \
              -o "evidence/${name}.json" -w '%{http_code}' "$url" || true)
            [ -n "$code" ] || code='000'
            printf '%s\n' "$code" > "evidence/${name}.status"
            echo "$name: HTTP $code"
          }
          capture health "$PRODUCTION_URL/api/health" 60
          capture coverage "$PRODUCTION_URL/api/coverage" 60
          capture dependability "$PRODUCTION_URL/api/dependability" 60
          capture scan "$PRODUCTION_URL/api/scan?start=$WINDOW_START&end=$WINDOW_END" 120

      - name: Create tamper-evident manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const names = ['health', 'coverage', 'dependability', 'scan'];
          const manifest = {
            evidenceDate: process.env.EVIDENCE_DATE,
            windowStart: process.env.WINDOW_START,
            windowEnd: process.env.WINDOW_END,
            capturedAt: new Date().toISOString(),
            productionUrl: process.env.PRODUCTION_URL,
            files: {}
          };
          for (const name of names) {
            const path = `evidence/${name}.json`;
            const content = existsSync(path) ? readFileSync(path) : Buffer.from('');
            const statusPath = `evidence/${name}.status`;
            manifest.files[`${name}.json`] = {
              httpStatus: existsSync(statusPath) ? readFileSync(statusPath, 'utf8').trim() : '000',
              bytes: content.length,
              sha256: createHash('sha256').update(content).digest('hex')
            };
          }
          if (existsSync('evidence/scan.json')) {
            try {
              const scan = JSON.parse(readFileSync('evidence/scan.json', 'utf8'));
              manifest.scanSummary = {
                deliveryMode: scan?.meta?.deliveryMode ?? null,
                queryCount: scan?.meta?.queryCount ?? null,
                successfulQueries: scan?.meta?.successfulQueries ?? null,
                eventCount: Array.isArray(scan?.events) ? scan.events.length : null,
                registryReconciled: scan?.meta?.registryReconciled ?? null,
                snapshotAgeMinutes: scan?.meta?.snapshot?.ageMinutes ?? null,
                snapshotSourceCommit: scan?.meta?.snapshot?.sourceCommit ?? null
              };
            } catch (error) {
              manifest.scanSummary = { parseError: String(error?.message || error) };
            }
          }
          writeFileSync('evidence/manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Reject unhealthy or structurally invalid evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const names = ['health', 'coverage', 'dependability', 'scan'];
          for (const name of names) {
            const status = readFileSync(`evidence/${name}.status`, 'utf8').trim();
            if (status !== '200') {
              const body = readFileSync(`evidence/${name}.json`, 'utf8');
              throw new Error(`${name} returned HTTP ${status}: ${body.slice(0, 500)}`);
            }
          }
          const health = JSON.parse(readFileSync('evidence/health.json', 'utf8'));
          const coverage = JSON.parse(readFileSync('evidence/coverage.json', 'utf8'));
          const dependability = JSON.parse(readFileSync('evidence/dependability.json', 'utf8'));
          const scan = JSON.parse(readFileSync('evidence/scan.json', 'utf8'));
          if (!['ok', 'degraded'].includes(health.status)) throw new Error('Health endpoint is not operational.');
          if (!coverage.summary || !coverage.gaps || !coverage.gates) throw new Error('Coverage evidence is incomplete.');
          if (typeof dependability.objectiveAchieved !== 'boolean') throw new Error('Dependability evidence is incomplete.');
          if (!Array.isArray(scan.events) || !Array.isArray(scan?.meta?.sourceChecks)) throw new Error('Scan evidence is incomplete.');
          if (!Number.isFinite(scan?.meta?.queryCount) || scan.meta.queryCount < 1) throw new Error('No source checks are recorded.');
          if (scan?.meta?.deliveryMode === 'governed-snapshot' && scan?.meta?.snapshot?.fresh !== true) {
            throw new Error('Governed snapshot is not fresh.');
          }
          console.log('Daily production evidence passed all structural gates.');
          NODE

      - name: Upload immutable daily evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abg-pulse-evidence-${{ env.EVIDENCE_DATE }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
