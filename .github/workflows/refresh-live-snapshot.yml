name: Refresh ABG Pulse governed snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-live-snapshot.yml'
      - 'scripts/refresh-live-snapshot.mjs'
      - 'lib/live-snapshot.mjs'
      - 'api/scan.js'
      - 'core.mjs'
      - 'official.mjs'
      - 'config/**'
      - 'data/entities.json'
      - 'data/source-registry.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abg-pulse-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install without mutating governed source
        run: npm install --ignore-scripts

      - name: Verify scanner before refresh
        run: |
          npm test
          npm run check

      - name: Build 30-day governed snapshot
        env:
          SNAPSHOT_SPAN_DAYS: '30'
          SNAPSHOT_MIN_SUCCESS_RATIO: '0.30'
        run: node scripts/refresh-live-snapshot.mjs /tmp/live-snapshot.json

      - name: Validate publication payload
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/live-snapshot.json', 'utf8'));
          if (payload.schemaVersion !== 1) throw new Error('Unsupported snapshot schema.');
          if (!payload.generatedAt) throw new Error('Missing snapshot timestamp.');
          if (!Array.isArray(payload.events)) throw new Error('Missing events array.');
          if (!Array.isArray(payload.meta?.sourceChecks)) throw new Error('Missing source-health detail.');
          if ((payload.meta?.queryCount || 0) < 1) throw new Error('No source checks were attempted.');
          if ((payload.meta?.successfulQueries || 0) < 10) throw new Error('Insufficient successful source checks.');
          if (payload.meta?.registryReconciled === false) throw new Error('Official registry reconciliation failed.');
          if (!payload.integrity?.payloadHash) throw new Error('Snapshot integrity hash missing.');
          console.log(JSON.stringify({
            generatedAt: payload.generatedAt,
            checks: payload.meta.queryCount,
            successful: payload.meta.successfulQueries,
            events: payload.events.length,
            rejected: payload.meta.rejectedArticleCount,
            reasons: payload.meta.rejectionReasons,
            payloadHash: payload.integrity.payloadHash
          }, null, 2));
          NODE

      - name: Publish only the governed snapshot to live-data branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/live-snapshot.json /tmp/live-snapshot.publish.json
          git config user.name 'ABG Pulse Snapshot Bot'
          git config user.email 'actions@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data
            git switch --force-create live-data origin/live-data
          else
            # Modern Git creates a genuinely empty orphan worktree. `git rm .`
            # fails when there is no index, so clean untracked remnants instead.
            git switch --orphan live-data
            git clean -fdx
          fi
          cp /tmp/live-snapshot.publish.json live-snapshot.json
          cat > README.md <<'TXT'
          # ABG Pulse live data

          This branch is generated by the governed ABG Pulse refresh workflow. It contains only the current public-source intelligence snapshot and deployment-suppression metadata. Do not edit it manually.
          TXT
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": {
              "deploymentEnabled": false
            }
          }
          JSON
          git add README.md live-snapshot.json vercel.json
          git commit -m "Refresh ABG Pulse snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:live-data

      - name: Verify published snapshot and production consumer
        shell: bash
        env:
          RAW_SNAPSHOT_URL: https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/live-snapshot.json
          PRODUCTION_SCAN_URL: https://abg-pulse-intelligence-v4.vercel.app/api/scan
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 20); do
            code=$(curl -L -sS --max-time 30 -o /tmp/published-snapshot.json -w '%{http_code}' "$RAW_SNAPSHOT_URL?run=$GITHUB_RUN_ID" || true)
            if [ "$code" = "200" ]; then
              source_sha=$(node --input-type=module -e "
                import { readFileSync } from 'node:fs';
                try { process.stdout.write(JSON.parse(readFileSync('/tmp/published-snapshot.json', 'utf8'))?.source?.commitSha || ''); }
                catch { process.stdout.write(''); }
              ")
              if [ "$source_sha" = "$GITHUB_SHA" ]; then
                published=true
                break
              fi
            fi
            echo "Attempt $attempt: published snapshot not current yet; retrying in 6 seconds."
            sleep 6
          done
          if [ "$published" != "true" ]; then
            echo 'Published snapshot did not become readable with the expected source commit.'
            exit 1
          fi

          end=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S.000Z)
          consumer=false
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 45 -o /tmp/production-scan.json -w '%{http_code}' \
              "$PRODUCTION_SCAN_URL?start=$start&end=$end&refresh=$GITHUB_RUN_ID" || true)
            if [ "$code" = "200" ]; then
              node --input-type=module <<'NODE' && consumer=true && break || true
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/production-scan.json', 'utf8'));
          if (!Array.isArray(payload.events)) throw new Error('Production consumer returned no events array.');
          if (payload?.meta?.deliveryMode !== 'governed-snapshot') throw new Error(`Unexpected delivery mode: ${payload?.meta?.deliveryMode}`);
          if (payload?.meta?.snapshot?.fresh !== true) throw new Error('Production snapshot is not marked fresh.');
          if (payload?.meta?.snapshot?.sourceCommit !== process.env.GITHUB_SHA) {
            throw new Error(`Production consumed ${payload?.meta?.snapshot?.sourceCommit}; expected ${process.env.GITHUB_SHA}.`);
          }
          console.log(JSON.stringify({
            deliveryMode: payload.meta.deliveryMode,
            sourceCommit: payload.meta.snapshot.sourceCommit,
            ageMinutes: payload.meta.snapshot.ageMinutes,
            events: payload.events.length
          }, null, 2));
          NODE
            fi
            echo "Attempt $attempt: production consumer returned HTTP $code or stale data; retrying in 10 seconds."
            sleep 10
          done
          if [ "$consumer" != "true" ]; then
            echo 'Production did not consume the governed snapshot within the verification window.'
            cat /tmp/production-scan.json 2>/dev/null || true
            exit 1
          fi

      - name: Preserve refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abg-pulse-live-snapshot-${{ github.run_id }}
          path: |
            /tmp/live-snapshot.json
            /tmp/published-snapshot.json
            /tmp/production-scan.json
          if-no-files-found: warn
          retention-days: 30
