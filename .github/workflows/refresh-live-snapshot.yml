name: Refresh ABG Pulse governed snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-live-snapshot.yml'
      - 'scripts/refresh-live-snapshot.mjs'
      - 'lib/live-snapshot.mjs'
      - 'lib/data-integrity.mjs'
      - 'scripts/verify-data-generation.mjs'
      - 'api/scan.js'
      - 'core.mjs'
      - 'official.mjs'
      - 'config/**'
      - 'data/entities.json'
      - 'data/source-registry.json'
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abg-pulse-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install without mutating governed source
        run: npm install --ignore-scripts

      - name: Verify scanner before refresh
        run: |
          npm test
          npm run check

      - name: Build 30-day governed snapshot
        env:
          SNAPSHOT_SPAN_DAYS: '30'
          SNAPSHOT_MIN_SUCCESS_RATIO: '0.30'
          # Essential allows 1,000 requests/day. The governed snapshot still
          # refreshes twice hourly, but GNews participates only in the :07
          # schedule (or an explicit manual run), keeping the 21-query base
          # plan at 504 scheduled requests/day before any future pagination.
          GNEWS_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *') && secrets.GNEWS_API_KEY || '' }}
        run: node scripts/refresh-live-snapshot.mjs /tmp/live-snapshot.json

      - name: Validate publication payload
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/live-snapshot.json', 'utf8'));
          if (payload.schemaVersion !== 1) throw new Error('Unsupported snapshot schema.');
          if (!payload.generatedAt) throw new Error('Missing snapshot timestamp.');
          if (!Array.isArray(payload.events)) throw new Error('Missing events array.');
          if (!Array.isArray(payload.meta?.sourceChecks)) throw new Error('Missing source-health detail.');
          if ((payload.meta?.queryCount || 0) < 1) throw new Error('No source checks were attempted.');
          if ((payload.meta?.successfulQueries || 0) < 10) throw new Error('Insufficient successful source checks.');
          if (payload.meta?.registryReconciled === false) throw new Error('Official registry reconciliation failed.');
          if (!payload.integrity?.payloadHash) throw new Error('Snapshot integrity hash missing.');
          console.log(JSON.stringify({
            generatedAt: payload.generatedAt,
            checks: payload.meta.queryCount,
            successful: payload.meta.successfulQueries,
            events: payload.events.length,
            rejected: payload.meta.rejectedArticleCount,
            reasons: payload.meta.rejectionReasons,
            payloadHash: payload.integrity.payloadHash
          }, null, 2));
          NODE

      - name: Publish only the governed snapshot to live-data branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/live-snapshot.json /tmp/live-snapshot.publish.json
          git config user.name 'ABG Pulse Snapshot Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin live-data
          git worktree add --detach /tmp/abg-snapshot-publish origin/live-data
          cp /tmp/live-snapshot.publish.json /tmp/abg-snapshot-publish/live-snapshot.json
          git -C /tmp/abg-snapshot-publish add live-snapshot.json
          git -C /tmp/abg-snapshot-publish commit -m "Refresh ABG Pulse snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          for attempt in $(seq 1 6); do
            if git -C /tmp/abg-snapshot-publish push origin HEAD:live-data; then
              exit 0
            fi
            git -C /tmp/abg-snapshot-publish fetch origin live-data
            git -C /tmp/abg-snapshot-publish rebase origin/live-data
            sleep $((attempt * 5))
          done
          echo 'Snapshot publication failed; do not claim a successful refresh.'
          exit 1

      - name: Verify published snapshot and production consumer
        shell: bash
        env:
          RAW_SNAPSHOT_URL: https://raw.githubusercontent.com/NinjaRK/abg-pulse/live-data/live-snapshot.json
          PRODUCTION_SCAN_URL: https://abg-pulse-intelligence-v4.vercel.app/api/scan
        run: |
          set -euo pipefail
          published=false
          for attempt in $(seq 1 20); do
            code=$(curl -L -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/published-snapshot.json -w '%{http_code}' "$RAW_SNAPSHOT_URL?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&probe=$attempt" || true)
            if [ "$code" = "200" ] && node scripts/verify-data-generation.mjs snapshot-publication /tmp/live-snapshot.json /tmp/published-snapshot.json > /tmp/snapshot-publication-proof.json; then
              published=true
              break
            fi
            sleep 6
          done
          if [ "$published" != "true" ]; then
            echo 'The exact snapshot generation/hash was not retrieved.'
            exit 1
          fi
          end=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S.000Z)
          for attempt in $(seq 1 12); do
            code=$(curl -L -sS --max-time 45 -H 'Cache-Control: no-cache' -o /tmp/production-scan.json -w '%{http_code}' "$PRODUCTION_SCAN_URL?start=$start&end=$end&run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&probe=$attempt" || true)
            if [ "$code" = "200" ] && node scripts/verify-data-generation.mjs snapshot-consumer /tmp/live-snapshot.json /tmp/production-scan.json > /tmp/snapshot-consumer-proof.json; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production did not demonstrate consumption of the exact published data generation.'
          exit 1

      - name: Preserve refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abg-pulse-live-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/live-snapshot.json
            /tmp/published-snapshot.json
            /tmp/production-scan.json
            /tmp/snapshot-publication-proof.json
            /tmp/snapshot-consumer-proof.json
          if-no-files-found: warn
          retention-days: 30
