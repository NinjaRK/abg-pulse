name: Refresh ABG Pulse governed snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-live-snapshot.yml'
      - 'scripts/refresh-snapshot.mjs'
      - 'api/scan.js'
      - 'core.mjs'
      - 'config/**'
      - 'data/entities.json'
      - 'data/source-registry.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abg-pulse-live-snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify scanner before refresh
        run: |
          npm test
          npm run check

      - name: Build 30-day governed snapshot
        env:
          ABG_PULSE_SNAPSHOT_DAYS: '30'
          ABG_PULSE_SNAPSHOT_OUTPUT: /tmp/live-snapshot.json
        run: node scripts/refresh-snapshot.mjs

      - name: Validate publication payload
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('/tmp/live-snapshot.json', 'utf8'));
          if (!Array.isArray(payload.events)) throw new Error('Missing events array');
          if (!payload.snapshot?.generatedAt) throw new Error('Missing snapshot timestamp');
          if ((payload.meta?.successfulQueries || 0) < 10) throw new Error('Insufficient successful source checks');
          if (payload.meta?.registryReconciled === false) throw new Error('Registry reconciliation failed');
          console.log(JSON.stringify({
            generatedAt: payload.snapshot.generatedAt,
            checks: payload.meta.queryCount,
            successful: payload.meta.successfulQueries,
            events: payload.events.length,
            rejected: payload.meta.rejectedArticleCount,
            reasons: payload.meta.rejectionReasons
          }, null, 2));
          NODE

      - name: Publish only the governed snapshot to live-data branch
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/live-snapshot.json /tmp/live-snapshot.publish.json
          git config user.name 'ABG Pulse Snapshot Bot'
          git config user.email 'actions@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin live-data >/dev/null 2>&1; then
            git fetch origin live-data
            git switch --force-create live-data origin/live-data
          else
            git switch --orphan live-data
            git rm -rf .
          fi
          mkdir -p data
          cp /tmp/live-snapshot.publish.json data/live-snapshot.json
          cat > README.md <<'TXT'
          # ABG Pulse live data

          This branch is generated by a governed GitHub Actions workflow. It contains only the latest public-source intelligence snapshot. Do not edit it manually.
          TXT
          git add README.md data/live-snapshot.json
          git commit -m "Refresh ABG Pulse snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:live-data

      - name: Preserve refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abg-pulse-live-snapshot-${{ github.run_id }}
          path: /tmp/live-snapshot.json
          if-no-files-found: warn
          retention-days: 30
