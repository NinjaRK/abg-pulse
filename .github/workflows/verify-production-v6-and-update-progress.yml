name: Verify v6 production and update earned progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-production-v6-and-update-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-v6-production-progress
  cancel-in-progress: false

jobs:
  verify-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PRODUCTION_URL: https://abg-pulse-intelligence-v4.vercel.app
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact main commit to become production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v6-proof
          for attempt in $(seq 1 48); do
            code=$(curl -L -sS --max-time 30 -o /tmp/v6-proof/health.json -w '%{http_code}' "$PRODUCTION_URL/api/health" || true)
            deployed=$(node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              try { process.stdout.write(JSON.parse(readFileSync('/tmp/v6-proof/health.json','utf8'))?.deployment?.commitSha || '') } catch { process.stdout.write('') }
            " || true)
            if [ "$code" = '200' ] && [ "$deployed" = "$EXPECTED_SHA" ]; then
              echo "Exact production commit $EXPECTED_SHA verified on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: HTTP=$code deployed=${deployed:-missing} expected=$EXPECTED_SHA"
            sleep 20
          done
          echo 'Exact v6 commit did not reach production.'
          exit 1
      - name: Verify objective-critical production endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fS --max-time 90 "$PRODUCTION_URL/api/progress" -o /tmp/v6-proof/progress.json
          curl -L -fS --max-time 90 "$PRODUCTION_URL/api/authoritative?hours=24" -o /tmp/v6-proof/authoritative.json
          curl -L -fS --max-time 90 "$PRODUCTION_URL/api/entity-source-coverage?priority=true" -o /tmp/v6-proof/entity-source-coverage.json
          curl -L -fS --max-time 90 "$PRODUCTION_URL/api/deployment-status" -o /tmp/v6-proof/deployment-status.json
          curl -L -fS --max-time 150 "$PRODUCTION_URL/api/scan?start=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%S.000Z)&end=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" -o /tmp/v6-proof/scan.json
      - name: Apply fail-closed acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (name) => JSON.parse(readFileSync(`/tmp/v6-proof/${name}.json`, 'utf8'));
          const health = read('health');
          const progress = read('progress');
          const authoritative = read('authoritative');
          const coverage = read('entity-source-coverage');
          const deployment = read('deployment-status');
          const scan = read('scan');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(health?.deployment?.commitSha === process.env.EXPECTED_SHA, 'Production health commit does not match the expected commit.');
          assert(Number(health?.entityUniverse?.actual?.officialCompanies) === 42, 'Official company universe is not 42.');
          assert(Number(health?.entityUniverse?.actual?.officialLeadership) === 40, 'Official leadership universe is not 40.');
          assert(Number(health?.entityUniverse?.actual?.totalEntities) >= 190, 'Governed entity universe is unexpectedly small.');
          assert(Number.isFinite(progress.verifiedCompletion ?? progress.completion), 'Progress endpoint has no verified completion.');
          assert(Number.isFinite(progress.implementationCompletion), 'Progress endpoint has no implementation completion.');
          assert(Array.isArray(authoritative.records), 'Authoritative endpoint has no records array.');
          assert(authoritative?.meta?.deliveryMode === 'governed-authoritative-snapshot', 'Authoritative endpoint has the wrong delivery mode.');
          assert(Array.isArray(authoritative?.meta?.sourceChecks) && authoritative.meta.sourceChecks.length >= 1, 'Authoritative source-health evidence is missing.');
          assert(Number(authoritative?.meta?.ageMinutes) <= Number(authoritative?.meta?.staleAfterMinutes), 'Authoritative snapshot is stale.');
          assert(coverage?.summary?.entityCount >= 190, 'Entity-source coverage graph is incomplete.');
          assert(Array.isArray(coverage.unresolvedReferences), 'Unresolved source references are hidden.');
          assert(['healthy', 'failed', 'pending'].includes(deployment.state), 'Deployment observer returned an invalid state.');
          assert(Array.isArray(scan.events), 'Production scan has no events array.');
          assert(scan?.meta?.deliveryMode === 'governed-snapshot', 'Production scan is not serving the governed snapshot.');
          assert(Array.isArray(scan?.meta?.sourceChecks), 'Production scan source checks are missing.');
          const directCheck = scan.meta.sourceChecks.find((check) => check?.provider === 'Direct authoritative snapshot' || /authoritative/i.test(String(check?.provider || check?.query || '')));
          assert(directCheck && directCheck.ok !== false && directCheck.status !== 'failed', 'Direct authoritative evidence is not healthy inside the production scan.');

          const planPath = 'data/build-milestones.json';
          const plan = JSON.parse(readFileSync(planPath, 'utf8'));
          const byId = new Map(plan.milestones.map((item) => [item.id, item]));
          const m1 = byId.get('M1');
          const m2 = byId.get('M2');
          const m3 = byId.get('M3');
          const add = (item, line) => {
            item.evidence = Array.isArray(item.evidence) ? item.evidence : [];
            if (!item.evidence.includes(line)) item.evidence.push(line);
          };
          m1.completion = Math.max(Number(m1.completion || 0), 65);
          m1.implementationCompletion = Math.max(Number(m1.implementationCompletion || 0), 88);
          m2.completion = Math.max(Number(m2.completion || 0), 72);
          m2.implementationCompletion = Math.max(Number(m2.implementationCompletion || 0), 82);
          m3.completion = Math.max(Number(m3.completion || 0), 45);
          m3.implementationCompletion = Math.max(Number(m3.implementationCompletion || 0), 70);
          add(m1, `Exact production commit ${process.env.EXPECTED_SHA} passed health, governed-snapshot, Job Meter and deployment-observer gates.`);
          add(m2, `Production entity-source coverage endpoint reconciled ${coverage.summary.entityCount} governed entities and exposed ${coverage.unresolvedReferences.length} unresolved references.`);
          add(m3, `Production direct-authoritative endpoint served ${authoritative.meta.sourceCount} checked sources and direct evidence passed inside the governed scan.`);
          plan.updatedAt = new Date().toISOString();
          plan.programme = plan.programme || {};
          plan.programme.lastProductionProof = {
            verifiedAt: plan.updatedAt,
            commitSha: process.env.EXPECTED_SHA,
            productionUrl: process.env.PRODUCTION_URL,
            authoritativeSnapshotAgeMinutes: authoritative.meta.ageMinutes,
            entityCount: coverage.summary.entityCount,
            governedEventCount: scan.events.length,
            directAuthoritativeCheck: directCheck
          };
          writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          NODE
      - name: Re-run progress integrity and regressions
        run: |
          node --test tests/progress-meter.test.mjs tests/progress.test.mjs
          npm test
          node tests/validate-data.mjs
      - name: Commit only independently verified production progress
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Production Proof Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/build-milestones.json
          if git diff --cached --quiet; then
            echo 'Production proof is already recorded.'
            exit 0
          fi
          git commit -m 'Record independently verified v6 production progress'
          git push origin HEAD:main
      - name: Upload immutable proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-production-proof-${{ github.sha }}
          path: /tmp/v6-proof/
          if-no-files-found: warn
          retention-days: 90
