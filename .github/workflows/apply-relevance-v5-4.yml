name: Apply ABG Pulse relevance hardening

on:
  push:
    branches:
      - sol/relevance-hardening-v5-4
    paths:
      - '.bootstrap/relevance-v5.4.retry2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply verified relevance patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          parts = sorted(Path('.bootstrap').glob('relevance-v5.4.part.*'))
          assert len(parts) == 7, f'Expected 7 patch chunks; found {len(parts)}'
          encoded = ''.join(path.read_text() for path in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest() == '6e808a71d8d1d73cb2ca314ed2d39f67a9fc369b25cf02837d76a8d6afb0780e'
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '054366d5f2cb1a9fc5683fbcacac5a8450738a87cfa01639e3dcd9b304fb825e'
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '568864351f5b4f19dfae4c92fa113166f5a182060f29c1b58b518cb999ceff00'
          Path('/tmp/relevance-v5.4.patch').write_bytes(patch)
          print(f'Reconstructed {len(patch)}-byte verified patch from {len(parts)} chunks.')
          PY
          git apply --check /tmp/relevance-v5.4.patch
          git apply /tmp/relevance-v5.4.patch

      - name: Mark release version
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          pkg.version = '5.2.0';
          writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const note = `## 5.2.0 — Relevance hardening\n\n- Excludes routine stock tips, target-price stories, generic market roundups and price movement without a corporate event.\n- Prevents public-forum posts from becoming news events or inflating materiality, certainty and momentum.\n- Requires direct ABG relevance for non-official coverage while preserving official entity hints.\n- Stops uncertainty alone from promoting a story to Watch.\n- Uses the latest evidence timestamp instead of scan time for event updates.\n- Adds transparent rejection reasons and seven regression tests.\n\n`;
          writeFileSync('CHANGELOG.md', changelog.includes('## 5.2.0 — Relevance hardening') ? changelog : changelog.replace(/^# .*\n+/, (head) => `${head}${note}`));
          NODE

      - name: Run full automated verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core.mjs api/scan.js tests/core.test.mjs tests/scan.test.mjs package.json CHANGELOG.md
          git rm -f .bootstrap/relevance-v5.4.ready .bootstrap/relevance-v5.4.retry .bootstrap/relevance-v5.4.retry2 .bootstrap/relevance-v5.4.patch.gz.b64 .bootstrap/relevance-v5.4.part.* .github/workflows/apply-relevance-v5-4.yml
          git commit -m 'Harden live relevance and noise rejection'
          git push origin HEAD:sol/relevance-hardening-v5-4
