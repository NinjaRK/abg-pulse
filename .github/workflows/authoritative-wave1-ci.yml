name: Verify direct authoritative source wave one

on:
  pull_request:
    paths:
      - 'config/authoritative-sources-wave1.json'
      - 'lib/authoritative-sources.mjs'
      - 'scripts/refresh-authoritative-wave1.mjs'
      - 'tests/authoritative-sources.test.mjs'
      - '.github/workflows/authoritative-wave1-ci.yml'
  push:
    branches:
      - sol/authoritative-source-wave1-v2
    paths:
      - 'config/authoritative-sources-wave1.json'
      - 'lib/authoritative-sources.mjs'
      - 'scripts/refresh-authoritative-wave1.mjs'
      - 'tests/authoritative-sources.test.mjs'
      - '.github/workflows/authoritative-wave1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run full regression suite
        run: npm test

      - name: Check new module and refresh runner syntax
        run: |
          node --check lib/authoritative-sources.mjs
          node --check scripts/refresh-authoritative-wave1.mjs

      - name: Run SEC EDGAR live canary
        env:
          AUTHORITATIVE_SOURCE_IDS: sec-novelis
          AUTHORITATIVE_LOOKBACK_HOURS: '720'
          AUTHORITATIVE_MIN_SUCCESS_RATIO: '1.0'
          AUTHORITATIVE_TIMEOUT_MS: '20000'
          AUTHORITATIVE_OUTPUT: out/authoritative-wave1.json
          AUTHORITATIVE_MANIFEST_OUTPUT: out/authoritative-wave1.manifest.json
          AUTHORITATIVE_SOURCE_USER_AGENT: 'ABG-Pulse/1.0 (public-source monitor; abg-pulse@users.noreply.github.com)'
        run: node scripts/refresh-authoritative-wave1.mjs

      - name: Verify canary evidence structure
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('out/authoritative-wave1.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('out/authoritative-wave1.manifest.json', 'utf8'));
          if (payload.sourceCount !== 1) throw new Error(`Expected one canary source; received ${payload.sourceCount}`);
          if (payload.successfulSourceCount !== 1) throw new Error('SEC EDGAR canary did not succeed.');
          if (payload.sourceChecks?.[0]?.sourceId !== 'sec-novelis') throw new Error('SEC canary lineage is missing.');
          if (!manifest.sha256 || manifest.sha256.length !== 64) throw new Error('Canary manifest digest is invalid.');
          console.log(JSON.stringify({
            source: payload.sourceChecks[0].sourceId,
            records: payload.recordCount,
            checkedAt: payload.sourceChecks[0].checkedAt,
            digest: manifest.sha256
          }, null, 2));
          NODE

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-wave1-canary-${{ github.sha }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
