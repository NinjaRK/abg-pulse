name: Apply and promote ABG Pulse query coverage v5.4

on:
  push:
    branches:
      - sol/query-coverage-v5-4
    paths:
      - '.build/query-plan-v5.4.ready'

permissions:
  contents: write

jobs:
  apply-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic integration patch
        run: node scripts/apply-query-plan.mjs

      - name: Install without bootstrap side effects
        run: npm install --ignore-scripts

      - name: Run full product verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { buildEntityQueryPlan } from './lib/query-plan.mjs';
          const entities = JSON.parse(readFileSync('data/entities.json', 'utf8'));
          const baseGroups = JSON.parse(readFileSync('config/queries.json', 'utf8'));
          const plan = buildEntityQueryPlan({ entities, baseGroups });
          if (!Object.values(plan.gates).every(Boolean)) {
            console.error(JSON.stringify(plan, null, 2));
            throw new Error('Entity-complete discovery query gates failed.');
          }
          if (plan.summary.maximumQueryLength > 1250) throw new Error('Generated query exceeds safe length.');
          console.log(JSON.stringify(plan.summary, null, 2));
          NODE

      - name: Refuse promotion if main moved outside candidate history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Main moved after the candidate branch was created; refusing unsafe promotion.'
            exit 1
          }

      - name: Commit verified integration and fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ABG Pulse Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/query-plan.mjs tests/query-plan.test.mjs api/scan.js api/coverage.js package.json
          git rm -f .build/query-plan-v5.4.ready scripts/apply-query-plan.mjs .github/workflows/apply-query-plan-v5-4.yml
          git commit -m 'Add entity-complete bounded discovery query plan'
          git push origin HEAD:sol/query-coverage-v5-4
          git push origin HEAD:main
