name: Verify persistence health contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-persistence-health-build.yml'
      - 'db/migrations/002_claim_evidence_audit.sql'
      - 'db/migrations/003_editorial_corrections.sql'
      - 'db/migrations/004_persistence_health.sql'
      - 'api/persistence-health.js'
      - 'lib/persistence-freshness.mjs'
      - 'tests/persistence-health-api.test.mjs'
      - 'tests/persistence-freshness-regression.test.mjs'
      - 'tests/persistence-verification-workflow.test.mjs'
      - 'bootstrap.mjs'
      - 'tests/bootstrap-*.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/verify-persistence-health-build.yml'
      - 'db/migrations/004_persistence_health.sql'
      - 'api/persistence-health.js'
      - 'lib/persistence-freshness.mjs'
      - 'tests/persistence-health-api.test.mjs'
      - 'tests/persistence-freshness-regression.test.mjs'
      - 'tests/persistence-verification-workflow.test.mjs'
      - 'bootstrap.mjs'
      - 'tests/bootstrap-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-persistence-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: abg_pulse_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abg_pulse_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: abg_pulse_health_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run health API tests and syntax checks
        run: |
          node --test tests/persistence-health-api.test.mjs tests/persistence.test.mjs
          node --check api/persistence-health.js
      - name: Install PostgreSQL client if required
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Apply all persistence migrations
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin create role anon nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated nologin; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role nologin bypassrls; exception when duplicate_object then null; end $$;
          SQL
          psql -v ON_ERROR_STOP=1 -f db/migrations/002_claim_evidence_audit.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/003_editorial_corrections.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/004_persistence_health.sql
      - name: Prove empty database reports non-operational truth
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -At -c "select public.pulse_persistence_health()::text" > /tmp/health-empty.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync('/tmp/health-empty.json', 'utf8'));
          if (health.ok !== true) throw new Error('Health RPC itself failed.');
          if (health.quality.hasIngestedGraph !== false) throw new Error('Empty database falsely claims an ingested graph.');
          if (health.counts.graph_runs !== 0) throw new Error('Empty database graph-run count is not zero.');
          if (Object.values(health.rls).some((value) => value !== true)) throw new Error('RLS is not enabled on every persistence table.');
          console.log(JSON.stringify(health, null, 2));
          NODE
      - name: Ingest fixture and prove health changes only with real evidence
        shell: bash
        run: |
          set -euo pipefail
          graph=$(cat tests/fixtures/claim-evidence-graph.json)
          manifest=$(printf 'c%.0s' {1..64})
          psql -v ON_ERROR_STOP=1 -v graph="$graph" -v manifest="$manifest" -At <<'SQL' > /tmp/ingest-health-fixture.json
          select public.pulse_ingest_claim_graph(:'graph'::jsonb, :'manifest', 'health-test', 'health-seed-request')::text;
          SQL
          psql -v ON_ERROR_STOP=1 -At -c "select public.pulse_persistence_health()::text" > /tmp/health-ingested.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const health = JSON.parse(readFileSync('/tmp/health-ingested.json', 'utf8'));
          if (health.quality.hasIngestedGraph !== true) throw new Error('Ingested graph is not recognised.');
          if (health.quality.latestRunHasNoUnsupportedMaterialClaims !== true) throw new Error('Material-claim safety is not reflected.');
          if (health.quality.auditTrailPresent !== true) throw new Error('Audit trail is not reflected.');
          if (health.counts.graph_runs !== 1 || health.counts.claims !== 2 || health.counts.evidence !== 1) throw new Error('Persistence counts do not reconcile.');
          if (!health.latestRun?.source_commit) throw new Error('Latest-run provenance is missing.');
          console.log(JSON.stringify(health, null, 2));
          NODE
      - name: Run complete product regression suite
        run: |
          npm test
          npm run check
      - name: Preserve progress values and repository files
        run: |
          node --test tests/progress-meter.test.mjs tests/progress.test.mjs
          git diff --exit-code HEAD -- data/build-milestones.json
      - name: Record isolated database evidence without changing progress
        env:
          TESTED_COMMIT: ${{ github.sha }}
          VERIFICATION_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const empty = JSON.parse(readFileSync('/tmp/health-empty.json', 'utf8'));
          const ingested = JSON.parse(readFileSync('/tmp/health-ingested.json', 'utf8'));
          assert.equal(empty.quality.hasIngestedGraph, false);
          assert.equal(ingested.quality.hasIngestedGraph, true);
          const proof = {
            testedCommit: process.env.TESTED_COMMIT,
            workflowRunId: process.env.VERIFICATION_RUN_ID,
            verifiedAt: new Date().toISOString(),
            environment: 'isolated_ci_postgresql_16',
            healthRpc: 'pulse_persistence_health',
            emptyDatabasePassed: true,
            ingestedFixturePassed: true,
            fixtureCounts: ingested.counts,
            rls: ingested.rls,
            progressChanged: false,
            productionDatabaseTested: false,
            productionDatabaseConnected: null,
            caveat: 'This evidence proves the isolated database contract, not production readiness. Progress scores are unchanged.'
          };
          writeFileSync('/tmp/persistence-build-verification.json', `${JSON.stringify(proof, null, 2)}\n`);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Isolated database verification\n\n\`\`\`json\n${JSON.stringify(proof, null, 2)}\n\`\`\`\n`);
          console.log(JSON.stringify(proof, null, 2));
          NODE
      - name: Upload immutable health proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistence-health-proof-${{ github.run_id }}-${{ github.sha }}
          path: |
            /tmp/health-empty.json
            /tmp/ingest-health-fixture.json
            /tmp/health-ingested.json
            /tmp/persistence-build-verification.json
          if-no-files-found: warn
          retention-days: 90
