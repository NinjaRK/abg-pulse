name: Diagnose production read-only

on:
  push:
    branches: ['fix/persistence-health-hardening-20260908']
    paths: ['.github/workflows/diagnose-production-readonly.yml']

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture public endpoint responses without credentials or writes
        run: |
          mkdir -p /tmp/production-diagnostic
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const base = 'https://abg-pulse-intelligence-v4.vercel.app';
          const report = { observedAt: new Date().toISOString(), writesPerformed: false, endpoints: [] };
          for (const path of ['/', '/api/health', '/api/persistence-health', '/api/claims?summaryOnly=true']) {
            const url = new URL(path, base);
            url.searchParams.set('diagnostic', Date.now());
            const observation = { path };
            try {
              const response = await fetch(url, { method: 'GET', redirect: 'manual',
                headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(25_000) });
              const text = await response.text();
              observation.httpStatus = response.status;
              observation.contentType = response.headers.get('content-type');
              observation.cacheControl = response.headers.get('cache-control');
              observation.location = response.headers.get('location');
              observation.vercelId = response.headers.get('x-vercel-id');
              if (observation.contentType?.includes('application/json')) {
                const data = JSON.parse(text);
                observation.status = data.status;
                observation.error = data.error;
                observation.operational = data.operational;
                observation.failedClosed = data.failedClosed;
                observation.deployment = data.deployment;
                observation.configured = data.configured;
                observation.quality = data.quality;
                observation.freshness = data.freshness;
                observation.summary = data.summary;
                observation.filteredSummary = data.filteredSummary;
                observation.checkedAt = data.checkedAt;
              } else {
                observation.textPreview = text.slice(0, 250);
              }
            } catch (error) {
              observation.requestError = error.message;
              observation.cause = error.cause?.message;
            }
            report.endpoints.push(observation);
          }
          writeFileSync('/tmp/production-diagnostic/observations.json', `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: production-readonly-diagnostic-${{ github.sha }}
          path: /tmp/production-diagnostic/observations.json
          retention-days: 14
